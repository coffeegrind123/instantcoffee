name: qwen36-forge

# Two interchangeable inference backends, one proxy in front of whichever is up.
# The active one is chosen by COMPOSE_PROFILES in .env:
#
#   COMPOSE_PROFILES=ik        ik_llama.cpp + a Thireus recipe-built model
#   COMPOSE_PROFILES=mainline  upstream llama.cpp + an unsloth GGUF
#
# They are NOT interchangeable at the model level: Thireus recipes use ik-only
# quant types (iq4_ks, iq5_ks, iq6_k) that mainline cannot read, and the MTP
# GGUF's speculative head is a mainline feature. Engine and weights are a
# matched pair, so BACKEND_HOST must agree with COMPOSE_PROFILES.

services:
  # ---------------------------------------------------------------------------
  # ik_llama.cpp (Thireus fork) — recipe-built, perplexity-optimised weights.
  # ---------------------------------------------------------------------------
  ikllama:
    profiles: ["ik"]
    build:
      context: .
      dockerfile: Dockerfile.ikllama
      args:
        IK_RELEASE: ${IK_RELEASE}
        IK_VARIANT: ${IK_VARIANT}
    image: qwen36-forge/ikllama:${IK_RELEASE}
    container_name: qwen36-ikllama
    restart: unless-stopped
    gpus: all
    ports:
      - "${BIND_ADDR}:${LLAMA_PORT}:8080"
    volumes:
      - "${MODELS_DIR}:/models"
    # A recipe model is 852 shards, all opened at once. The default 1024-fd
    # limit is close enough to bite, and it surfaces mid-load as a confusing
    # "too many open files" rather than anything mentioning shards.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # The shard filename encodes the recipe, so it is discovered at start rather
    # than pinned in .env — one less thing to keep in sync after a recipe change.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        shard=$$(ls /models/ik/*-00001-of-*.gguf 2>/dev/null | head -1)
        if [ -z "$$shard" ]; then
          echo "No model shards in /models/ik — run ./scripts/download-ik-model.sh" >&2
          exit 1
        fi
        echo "Loading $$shard"
        exec /opt/ik/llama-server \
          -m "$$shard" \
          --alias ${MODEL_ALIAS} \
          --host 0.0.0.0 --port 8080 \
          --jinja \
          --reasoning-format deepseek \
          --reasoning-budget ${REASONING_BUDGET} \
          -ngl 99 \
          -fa on \
          -ctk ${IK_CACHE_TYPE_K} -ctv ${IK_CACHE_TYPE_V} \
          -c ${CTX_SIZE} \
          -b ${IK_BATCH} -ub ${IK_UBATCH} \
          -amb ${IK_ATTN_MAX_BATCH} \
          --parallel ${PARALLEL_SLOTS} \
          --temp ${TEMPERATURE} --top-p ${TOP_P} --top-k ${TOP_K} --min-p ${MIN_P} \
          --no-mmap \
          --metrics \
          ${IK_EXTRA_FLAGS}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      # 852 shards off a 9p mount is slower to load than one file.
      start_period: 900s
      retries: 5

  # ---------------------------------------------------------------------------
  # Upstream llama.cpp — kept working for unsloth GGUFs (incl. the MTP variant).
  # ---------------------------------------------------------------------------
  llama:
    profiles: ["mainline"]
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_TAG}
    container_name: qwen36-llama
    restart: unless-stopped
    gpus: all
    ports:
      - "${BIND_ADDR}:${LLAMA_PORT}:8080"
    volumes:
      - "${MODELS_DIR}:/models:ro"
    # --jinja is what turns on native function calling. Without it llama.cpp
    # ignores the `tools` parameter entirely and forge has nothing to guard.
    command: >
      -m /models/${GGUF_FILE}
      --alias ${MODEL_ALIAS}
      --host 0.0.0.0
      --port 8080
      --jinja
      --reasoning-format deepseek
      --reasoning-budget ${REASONING_BUDGET}
      -ngl ${NGL}
      -fa ${FLASH_ATTN}
      -c ${CTX_SIZE}
      -np ${PARALLEL_SLOTS}
      --no-context-shift
      ${SPEC_TYPE:+--spec-type ${SPEC_TYPE} --spec-draft-n-max ${SPEC_DRAFT_N_MAX}}
      --temp ${TEMPERATURE}
      --top-p ${TOP_P}
      --top-k ${TOP_K}
      --min-p ${MIN_P}
      --metrics
      ${LLAMA_EXTRA_FLAGS}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      # A 27B GGUF takes a while to read off disk and upload to VRAM on a cold
      # start. start_period keeps those minutes from counting as failures.
      start_period: 600s
      retries: 5

  # ---------------------------------------------------------------------------
  # forge — guardrail proxy. Clients talk to this, never to a backend directly.
  # ---------------------------------------------------------------------------
  forge:
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    image: qwen36-forge/proxy:${FORGE_VERSION}
    container_name: qwen36-forge
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:${FORGE_PORT}:8081"
    # No depends_on: which backend exists depends on the active profile, and
    # compose cannot express that conditionally. forge boots fine against an
    # absent backend anyway — with --budget-mode manual it never probes at
    # startup — so it simply starts answering once the backend appears.
    command: >
      --backend-url http://${BACKEND_HOST}:8080
      --backend-capability ${FORGE_CAPABILITY}
      --budget-mode manual
      --budget-tokens ${CTX_SIZE}
      --max-retries ${FORGE_MAX_RETRIES}
      --max-tool-errors ${FORGE_MAX_TOOL_ERRORS}
      --reasoning-replay ${FORGE_REASONING_REPLAY}
      --backend-timeout ${FORGE_BACKEND_TIMEOUT}
      ${FORGE_EXTRA_FLAGS}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=4).status==200 else 1)"
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # One-shot: fetch a Thireus recipe model (852 shards) for the ik backend.
  #   docker compose --profile tools run --rm --user 0:0 ik-downloader
  # ---------------------------------------------------------------------------
  ik-downloader:
    profiles: ["tools"]
    image: qwen36-forge/ikllama:${IK_RELEASE}
    build:
      context: .
      dockerfile: Dockerfile.ikllama
      args:
        IK_RELEASE: ${IK_RELEASE}
        IK_VARIANT: ${IK_VARIANT}
    entrypoint: ["/opt/download_ik_model.sh"]
    environment:
      IK_MODEL_NAME: ${IK_MODEL_NAME}
      IK_RECIPE: ${IK_RECIPE}
      HF_TOKEN: ${HF_TOKEN:-}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - "${MODELS_DIR}:/models"

  # ---------------------------------------------------------------------------
  # One-shot: fetch a single-file unsloth GGUF for the mainline backend.
  #   docker compose --profile tools run --rm --user 0:0 downloader
  # ---------------------------------------------------------------------------
  downloader:
    profiles: ["tools"]
    image: qwen36-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/download_model.py"]
    environment:
      MODEL_REPO: ${MODEL_REPO}
      GGUF_FILE: ${GGUF_FILE}
      MMPROJ_FILE: ${MMPROJ_FILE}
      HF_TOKEN: ${HF_TOKEN:-}
      # Xet is huggingface_hub's default chunked transfer. On this link it
      # stalled dead at ~1.1 GB with the connection still open and no error, so
      # the downloader uses plain HTTP range requests, which resume reliably.
      # Set to "0" to try Xet again if your network is better behaved.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - "${MODELS_DIR}:/models"

  # ---------------------------------------------------------------------------
  # One-shot smoke test. Runs INSIDE the compose network, so it exercises the
  # same paths the services use rather than the host's port mapping.
  #   docker compose --profile tools run --rm smoketest
  # ---------------------------------------------------------------------------
  smoketest:
    profiles: ["tools"]
    image: qwen36-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/smoke_test.py"]
    environment:
      LLAMA_URL: http://${BACKEND_HOST}:8080
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      CTX_SIZE: ${CTX_SIZE}

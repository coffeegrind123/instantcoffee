name: qwen36-forge

services:
  # ---------------------------------------------------------------------------
  # llama-server — upstream llama.cpp + unsloth GGUF (MTP-capable).
  # ---------------------------------------------------------------------------
  llama:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_TAG}
    container_name: qwen36-llama
    restart: unless-stopped
    gpus: all
    environment:
      - LLAMA_SET_ROWS=1
    ports:
      - "${BIND_ADDR}:${LLAMA_PORT}:8080"
    volumes:
      - "${MODELS_DIR}:/models:ro"
      - slot-cache:/slots
    # --jinja is what turns on native function calling. Without it llama.cpp
    # ignores the `tools` parameter entirely and forge has nothing to guard.
    command: >
      -m /models/${GGUF_FILE}
      --alias ${MODEL_ALIAS}
      --host 0.0.0.0
      --port 8080
      --jinja
      --reasoning-format deepseek
      --reasoning-budget ${REASONING_BUDGET}
      --reasoning-budget-message "${REASONING_BUDGET_MESSAGE}"
      --chat-template-kwargs '{"preserve_thinking": true}'
      -ngl ${NGL}
      -fa ${FLASH_ATTN}
      -kvu
      -c ${CTX_SIZE}
      -np ${PARALLEL_SLOTS}
      --no-context-shift
      ${SPEC_TYPE:+--spec-type ${SPEC_TYPE} --spec-draft-n-max ${SPEC_DRAFT_N_MAX} --spec-draft-n-min ${SPEC_DRAFT_N_MIN} --spec-draft-p-min ${SPEC_DRAFT_P_MIN}}
      --temp ${TEMPERATURE}
      --top-p ${TOP_P}
      --top-k ${TOP_K}
      --min-p ${MIN_P}
      --cache-prompt
      --cache-ram ${CACHE_RAM}
      --cache-reuse ${CACHE_REUSE}
      --slot-prompt-similarity ${SLOT_PROMPT_SIMILARITY}
      --slot-save-path /slots
      --ctx-checkpoints ${CTX_CHECKPOINTS}
      --checkpoint-min-step ${CHECKPOINT_MIN_STEP}
      --metrics
      ${LLAMA_EXTRA_FLAGS}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      # A 27B GGUF takes a while to read off disk and upload to VRAM on a cold
      # start. start_period keeps those minutes from counting as failures.
      # 600s was too short here: 17.9 GB over a Docker Desktop bind mount
      # measured at 10-12 MB/s is a ~24 minute cold load, so the container was
      # being marked unhealthy while loading normally. Warm restarts are far
      # faster (the file is in the host's cache), so this only bites once.
      start_period: 2400s
      retries: 5

  # ---------------------------------------------------------------------------
  # forge — guardrail proxy. Clients talk to this, never to a backend directly.
  # ---------------------------------------------------------------------------
  forge:
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    image: qwen36-forge/proxy:${FORGE_VERSION}
    container_name: qwen36-forge
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:${FORGE_PORT}:8081"
    command: >
      --backend-url http://llama:8080
      --backend-capability ${FORGE_CAPABILITY}
      --budget-mode manual
      --budget-tokens ${CTX_SIZE}
      --max-retries ${FORGE_MAX_RETRIES}
      --max-tool-errors ${FORGE_MAX_TOOL_ERRORS}
      --reasoning-replay ${FORGE_REASONING_REPLAY}
      --backend-timeout ${FORGE_BACKEND_TIMEOUT}
      ${FORGE_EXTRA_FLAGS}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=4).status==200 else 1)"
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # headroom — context compression, in front of forge.
  #
  #   pi -> headroom :8787 -> forge :8081 -> llama :8080
  #
  # In FRONT of forge, not between forge and llama, for two reasons: forge's
  # retry-with-nudge loop would otherwise re-enter compression on every attempt
  # and hand llama.cpp different bytes each time, throwing away the prefix-KV
  # reuse that --cache-reuse / --slot-prompt-similarity exist for; and forge's
  # --budget-tokens accounting is only meaningful if it sees the request that
  # is actually sent.
  #
  # In the "headroom" profile, which scripts/lib.sh activates whenever
  # HEADROOM_ENABLED=1 (the default). One key therefore means one thing: in the
  # path and running, or neither. Set it to 0 and up/down/logs/ps stop seeing
  # this service at all.
  # ---------------------------------------------------------------------------
  headroom:
    profiles: ["headroom"]
    build:
      context: .
      dockerfile: Dockerfile.headroom
      args:
        HEADROOM_VERSION: ${HEADROOM_VERSION}
    image: qwen36-forge/headroom:${HEADROOM_VERSION}
    container_name: qwen36-headroom
    restart: unless-stopped
    depends_on:
      forge:
        condition: service_healthy
    ports:
      - "${BIND_ADDR}:${HEADROOM_PORT}:8787"
    environment:
      # Upstream. Both wires point at forge: pi uses the OpenAI one, and the
      # Anthropic one is set so that a stray /v1/messages request cannot escape
      # to api.anthropic.com from a stack whose whole premise is that nothing
      # leaves the machine.
      OPENAI_TARGET_API_URL: http://forge:8081
      ANTHROPIC_TARGET_API_URL: http://forge:8081
      # The dashboard's reachability probe HEADs the upstream base URL; forge
      # answers /health, not HEAD /. Skipping it avoids a permanent, wrong
      # "upstream down" banner.
      HEADROOM_SKIP_UPSTREAM_CHECK: "1"
      # Measured on 0.34.0 from a non-loopback source (a browser on the host
      # reaches the container through Docker's gateway, so it never looks like
      # 127.0.0.1): /dashboard, /stats, /stats-history and /metrics all answer
      # 200, and /settings answers 404 — it stays loopback-only, and
      # HEADROOM_PROXY_TRUSTED_DASHBOARD_CLIENT_CIDRS did NOT change that, so
      # it is deliberately not set here. Reach /settings with:
      #   docker exec qwen36-headroom python -c "import urllib.request; \
      #     print(urllib.request.urlopen('http://127.0.0.1:8787/settings').read())"
      #
      # NOTE: headroom's own startup banner warns that /v1/* is unauthenticated
      # on a non-loopback bind. What limits exposure here is BIND_ADDR
      # (127.0.0.1 by default) — exactly as it does for llama and forge, which
      # are equally unauthenticated. Set HEADROOM_PROXY_TOKEN if you publish
      # this on a LAN.
      # Read by scripts/headroom-entrypoint.sh, which maps them onto headroom's
      # own switches. See .env for what the values mean.
      HEADROOM_RECOVERY: ${HEADROOM_RECOVERY}
      HEADROOM_TARGET_RATIO: ${HEADROOM_TARGET_RATIO}
    command: >
      --openai-api-url http://forge:8081
      --provider-name forge
      --no-subscription-tracking
      --no-telemetry
      ${HEADROOM_EXTRA_FLAGS}
    volumes:
      - headroom-state:/home/headroom/.headroom
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=4).status==200 else 1)"
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 3

  # ---------------------------------------------------------------------------
  # One-shot: fetch a single-file unsloth GGUF.
  #   docker compose --profile tools run --rm --user 0:0 downloader
  # ---------------------------------------------------------------------------
  downloader:
    profiles: ["tools"]
    image: qwen36-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/download_model.py"]
    environment:
      MODEL_REPO: ${MODEL_REPO}
      GGUF_FILE: ${GGUF_FILE}
      MMPROJ_FILE: ${MMPROJ_FILE}
      HF_TOKEN: ${HF_TOKEN:-}
      # Xet is huggingface_hub's default chunked transfer. On this link it
      # stalled dead at ~1.1 GB with the connection still open and no error, so
      # the downloader uses plain HTTP range requests, which resume reliably.
      # Set to "0" to try Xet again if your network is better behaved.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - "${MODELS_DIR}:/models"

  # ---------------------------------------------------------------------------
  # One-shot smoke test. Runs INSIDE the compose network.
  #   docker compose --profile tools run --rm smoketest
  # ---------------------------------------------------------------------------
  smoketest:
    profiles: ["tools"]
    image: qwen36-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/smoke_test.py"]
    environment:
      LLAMA_URL: http://llama:8080
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      CTX_SIZE: ${CTX_SIZE}
      # Empty unless scripts/smoke-test.sh exports it (it does when
      # HEADROOM_ENABLED=1), which keeps the default run measuring the same
      # two-hop stack every committed result was measured on.
      HEADROOM_URL: ${HEADROOM_SMOKE_URL:-}

  # ---------------------------------------------------------------------------
  # One-shot coding evaluation. Runs INSIDE the compose network.
  #   docker compose --profile tools run --rm eval
  # ---------------------------------------------------------------------------
  eval:
    profiles: ["tools"]
    image: qwen36-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/eval.py"]
    environment:
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-900}
      EVAL_REPEAT_THRESHOLD: ${EVAL_REPEAT_THRESHOLD:-3}
      EVAL_SCORE_FLOOR: ${EVAL_SCORE_FLOOR:-0.5}
      # Thinking is off by default here — every committed score was measured
      # that way. Both knobs are stamped into the result JSON.
      EVAL_THINKING: ${EVAL_THINKING:-off}
      EVAL_SYSTEM_PROMPT_FILE: ${EVAL_SYSTEM_PROMPT_FILE:-}

  # ---------------------------------------------------------------------------
  # One-shot A/B of a THINK_LANG fragment. Runs INSIDE the compose network.
  #   ./scripts/ab-think-lang.sh          (preferred — resolves the fragment)
  #   docker compose --profile tools run --rm ab-think-lang --repeat 3
  # Thinking is forced ON in both arms, which the standard eval does not do.
  # ---------------------------------------------------------------------------
  ab-think-lang:
    profiles: ["tools"]
    image: qwen36-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/ab_think_lang.py"]
    environment:
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-900}

  # ---------------------------------------------------------------------------
  # One-shot A/B of headroom compression. Runs INSIDE the compose network.
  #   ./scripts/ab-headroom.sh          (preferred — checks the stack first)
  #   docker compose --profile tools run --rm ab-headroom --repeat 2
  #
  # Both arms go through headroom so the network path is identical; the control
  # arm sends x-headroom-bypass, which headroom documents as the "do not touch
  # my bytes" contract. Reuses the forge image because the scripts already live
  # there — nothing about this needs the headroom package.
  #
  # In the "tools" profile, NOT "headroom": the headroom profile is active for
  # the whole stack whenever HEADROOM_ENABLED=1, and a one-shot in it would be
  # started by every `up`. Every other one-shot here lives in "tools" for the
  # same reason.
  # ---------------------------------------------------------------------------
  ab-headroom:
    profiles: ["tools"]
    image: qwen36-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/ab_headroom.py"]
    environment:
      HEADROOM_URL: http://headroom:8787
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-900}

  # ---------------------------------------------------------------------------
  # One-shot coding evaluation (extended). Runs INSIDE the compose network.
  #   docker compose --profile tools run --rm eval-harness
  # ---------------------------------------------------------------------------
  eval-harness:
    profiles: ["tools"]
    image: qwen36-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/eval_harness.py"]
    environment:
      LLAMA_URL: http://llama:8080
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-900}
      EVAL_REPEAT_THRESHOLD: ${EVAL_REPEAT_THRESHOLD:-3}
      EVAL_SCORE_FLOOR: ${EVAL_SCORE_FLOOR:-0.5}

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  slot-cache:
    name: qwen36-slot-cache
  # CCR store, session stats and dashboard data. On a volume rather than in the
  # container layer so a restart does not silently reset the savings numbers
  # you are trying to read.
  headroom-state:
    name: qwen36-headroom-state

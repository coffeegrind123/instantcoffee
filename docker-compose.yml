name: qwen38-forge

services:
  # ---------------------------------------------------------------------------
  # llama-server — upstream llama.cpp + unsloth GGUF (MTP-capable).
  # ---------------------------------------------------------------------------
  llama:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_TAG}
    container_name: qwen38-llama
    restart: unless-stopped
    gpus: all
    # llama-server runs as PID 1 and does not reap children. Twice on this box a
    # recreate died with "PID <n> is zombie and can not be killed", leaving a
    # container docker could neither stop nor replace until it was force-removed
    # by hand. init: true puts a real init in front to forward signals and reap.
    init: true
    environment:
      - LLAMA_SET_ROWS=1
    ports:
      - "${BIND_ADDR}:${LLAMA_PORT}:8080"
    volumes:
      - "${MODELS_DIR}:/models:ro"
      - slot-cache:/slots
    # --jinja is what turns on native function calling. Without it llama.cpp
    # ignores the `tools` parameter entirely and forge has nothing to guard.
    #
    # The creative samplers (xtc / dry / dynatemp / top-n-sigma / penalties) all
    # default to llama.cpp's own "disabled" values, so a .env predating those
    # keys still starts a server that behaves exactly as before.
    #
    # preserve_thinking, NOT preserve_reasoning. On startup b10573 logs
    #   "chat template supports preserving reasoning, consider enabling it via
    #    --reasoning-preserve"
    # Do not follow that hint here. --reasoning-preserve sets the template kwarg
    # `preserve_reasoning`, and this model's template never reads that key —
    # checked against the GGUF's embedded template, where `preserve_reasoning`
    # occurs 0 times and `preserve_thinking` occurs twice, in
    #   {%- if preserve_thinking is undefined or preserve_thinking is true
    #          or loop.index0 > ns.last_query_index %}
    # Note that branch also means the template PRESERVES BY DEFAULT when the key
    # is undefined, so the explicit `true` below is belt-and-braces, not the
    # thing switching it on. Setting --reasoning-preserve instead would be a
    # silent no-op.
    #
    # -ctk and -ctv MUST be the same type. A stock CUDA build compiles only
    # matched flash-attention kernels (f16/f16, q4_0/q4_0, q8_0/q8_0,
    # bf16/bf16); a mismatched pair returns BEST_FATTN_KERNEL_NONE and prefill
    # silently moves to the CPU. See CACHE_TYPE_K in .env, and llama.cpp#20866.
    # The defaults here are f16/f16 so a .env predating these keys is unchanged.
    #
    # Do NOT put comments inside the folded block below: `#` is not a comment in
    # a YAML folded scalar, it becomes part of the command line, and compose
    # then rejects the whole service with "invalid command line string".
    command: >
      -m /models/${GGUF_FILE}
      --alias ${MODEL_ALIAS}
      --host 0.0.0.0
      --port 8080
      --jinja
      --reasoning-format deepseek
      --reasoning-budget ${REASONING_BUDGET}
      --reasoning-budget-message "${REASONING_BUDGET_MESSAGE}"
      --chat-template-kwargs '{"preserve_thinking": true, "reasoning_effort": "${REASONING_EFFORT:-medium}"}'
      -ngl ${NGL}
      -fa ${FLASH_ATTN}
      -ctk ${CACHE_TYPE_K:-f16}
      -ctv ${CACHE_TYPE_V:-f16}
      -kvu
      -c ${CTX_SIZE}
      -np ${PARALLEL_SLOTS}
      --no-context-shift
      ${SPEC_TYPE:+--spec-type ${SPEC_TYPE} --spec-draft-n-max ${SPEC_DRAFT_N_MAX} --spec-draft-n-min ${SPEC_DRAFT_N_MIN} --spec-draft-p-min ${SPEC_DRAFT_P_MIN}}
      ${SPEC_NGRAM_MIN_HITS:+--spec-ngram-simple-min-hits ${SPEC_NGRAM_MIN_HITS}}
      ${SPEC_NGRAM_SIZE_N:+--spec-ngram-simple-size-n ${SPEC_NGRAM_SIZE_N}}
      ${SPEC_NGRAM_SIZE_M:+--spec-ngram-simple-size-m ${SPEC_NGRAM_SIZE_M}}
      --temp ${TEMPERATURE}
      --top-p ${TOP_P}
      --top-k ${TOP_K}
      --min-p ${MIN_P}
      --xtc-probability ${XTC_PROBABILITY:-0.0}
      --xtc-threshold ${XTC_THRESHOLD:-0.1}
      --dry-multiplier ${DRY_MULTIPLIER:-0.0}
      --dry-base ${DRY_BASE:-1.75}
      --dry-allowed-length ${DRY_ALLOWED_LENGTH:-2}
      --dry-penalty-last-n ${DRY_PENALTY_LAST_N:--1}
      --repeat-penalty ${REPEAT_PENALTY:-1.0}
      --repeat-last-n ${REPEAT_LAST_N:-64}
      --presence-penalty ${PRESENCE_PENALTY:-0.0}
      --frequency-penalty ${FREQUENCY_PENALTY:-0.0}
      --dynatemp-range ${DYNATEMP_RANGE:-0.0}
      --dynatemp-exp ${DYNATEMP_EXP:-1.0}
      --top-n-sigma ${TOP_N_SIGMA:--1.0}
      --cache-prompt
      --cache-ram ${CACHE_RAM}
      --cache-reuse ${CACHE_REUSE}
      --slot-prompt-similarity ${SLOT_PROMPT_SIMILARITY}
      --slot-save-path /slots
      --ctx-checkpoints ${CTX_CHECKPOINTS}
      --checkpoint-min-step ${CHECKPOINT_MIN_STEP}
      --metrics
      ${LLAMA_EXTRA_FLAGS}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      # A 27B GGUF takes a while to read off disk and upload to VRAM on a cold
      # start. start_period keeps those minutes from counting as failures.
      # 600s was too short here: 17.9 GB over a Docker Desktop bind mount
      # measured at 10-12 MB/s is a ~24 minute cold load, so the container was
      # being marked unhealthy while loading normally. Warm restarts are far
      # faster (the file is in the host's cache), so this only bites once.
      start_period: 2400s
      retries: 5

  # ---------------------------------------------------------------------------
  # forge — guardrail proxy. Clients talk to this, never to a backend directly.
  #
  # Two things here are forge 0.9 contract changes, both verified against a
  # running 0.9.0 rather than read off the migration doc:
  #
  #   * NO --budget-mode. forge 0.9 exits 2 with "unmanaged backends do not
  #     accept budget_mode" — an externally managed backend (--backend-url) is
  #     unmanaged, and the proxy is now unconditionally no-compaction.
  #     --budget-tokens survives as a reporting denominator only, which is all
  #     this stack ever wanted from it; pi does its own context management.
  #
  #   * The healthcheck probes /forge/health, NOT /health. In 0.9 /health
  #     forwards the BACKEND's readiness (measured: 502 while llama is down), so
  #     probing it would mark forge unhealthy for the whole ~24 minute cold load
  #     of a model that is loading perfectly normally. /forge/health is forge's
  #     own liveness and answered 200 with the backend unreachable.
  # ---------------------------------------------------------------------------
  forge:
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    image: qwen38-forge/proxy:${FORGE_VERSION}
    container_name: qwen38-forge
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:${FORGE_PORT}:8081"
    command: >
      --backend-url ${FORGE_BACKEND_URL:-http://llama:8080}
      --backend-capability ${FORGE_CAPABILITY}
      --budget-tokens ${CTX_SIZE}
      --max-retries ${FORGE_MAX_RETRIES}
      --max-tool-errors ${FORGE_MAX_TOOL_ERRORS}
      --reasoning-replay ${FORGE_REASONING_REPLAY}
      --backend-timeout ${FORGE_BACKEND_TIMEOUT}
      ${FORGE_EXTRA_FLAGS}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/forge/health', timeout=4).status==200 else 1)"
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # One-shot: fetch a single-file unsloth GGUF.
  #   docker compose --profile tools run --rm --user 0:0 downloader
  # ---------------------------------------------------------------------------
  downloader:
    profiles: ["tools"]
    image: qwen38-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/download_model.py"]
    environment:
      MODEL_REPO: ${MODEL_REPO}
      GGUF_FILE: ${GGUF_FILE}
      MMPROJ_FILE: ${MMPROJ_FILE}
      HF_TOKEN: ${HF_TOKEN:-}
      # The downloader compares the local file's size against what the Hub
      # currently serves, because repos re-upload under the same filename.
      # Unset, a size mismatch is reported and the local copy kept; set to 1,
      # the old file is moved aside as *.superseded and re-fetched.
      REDOWNLOAD_STALE: ${REDOWNLOAD_STALE:-}
      # Xet is huggingface_hub's default chunked transfer. On this link it
      # stalled dead at ~1.1 GB with the connection still open and no error, so
      # the downloader uses plain HTTP range requests, which resume reliably.
      # Set to "0" to try Xet again if your network is better behaved.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - "${MODELS_DIR}:/models"

  # ---------------------------------------------------------------------------
  # One-shot smoke test. Runs INSIDE the compose network.
  #   docker compose --profile tools run --rm smoketest
  # ---------------------------------------------------------------------------
  smoketest:
    profiles: ["tools"]
    image: qwen38-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/smoke_test.py"]
    environment:
      LLAMA_URL: http://llama:8080
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      CTX_SIZE: ${CTX_SIZE}

  # ---------------------------------------------------------------------------
  # Throughput benchmark. Runs INSIDE the compose network and talks to llama
  # directly — forge strips the `timings` block these numbers come from.
  #   ./scripts/bench.sh --full
  # ---------------------------------------------------------------------------
  bench:
    profiles: ["tools"]
    image: qwen38-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/bench.py"]
    environment:
      LLAMA_URL: http://llama:8080
      MODEL_ALIAS: ${MODEL_ALIAS}
      BENCH_TIMEOUT: ${BENCH_TIMEOUT:-900}
      # For `--entrypoint python bench /work/scripts/smoke_test.py`. That is not
      # the documented way to run the smoke test — ./scripts/smoke-test.sh uses
      # the `smoketest` service above, which has forwarded CTX_SIZE all along —
      # but it is reachable, and until 2026-08-23 it fell back to a hardcoded
      # 32768 and asserted `n_ctx >= 32768` under the name "context matches
      # CTX_SIZE". No recorded verification came from that path.
      # The rule it cost us anyway: a variable the container uses as a TUNABLE
      # may default; a variable it uses as a FACT ABOUT THE STACK IT IS
      # VERIFYING must be forwarded, because its default silently becomes the
      # answer. smoke_test.py now has no default and fails loudly instead.
      CTX_SIZE: ${CTX_SIZE}
      PARALLEL_SLOTS: ${PARALLEL_SLOTS:-1}

  # ---------------------------------------------------------------------------
  # One-shot A/B of a THINK_LANG fragment. Runs INSIDE the compose network.
  #   ./scripts/ab-think-lang.sh          (preferred — resolves the fragment)
  #   docker compose --profile tools run --rm ab-think-lang --repeat 3
  # Thinking is forced ON in both arms — measuring the fragment without it would
  # produce a meaningless dead heat.
  # ---------------------------------------------------------------------------
  ab-think-lang:
    profiles: ["tools"]
    image: qwen38-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/ab_think_lang.py"]
    environment:
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      AB_TIMEOUT: ${AB_TIMEOUT:-900}

  # ---------------------------------------------------------------------------
  # Literal fidelity at depth: do exact operational literals survive from deep
  # context into a TOOL-CALL ARGUMENT? Runs INSIDE the compose network.
  #   ./scripts/bench-literal.sh                     (90k, both records, control)
  #   ./scripts/bench-literal.sh --sweep 2000,16000,48000,90000 --repeat 3
  #
  # Talks to FORGE by default, not to llama: the failure this measures lands in
  # a tool call, and the tool path this stack actually uses goes through the
  # proxy. --via llama takes the proxy out of the comparison.
  #
  # LLAMA_URL is here as well, and is NOT redundant: /tokenize is a llama-server
  # endpoint that forge does not expose, and the document builder calibrates
  # against the real tokenizer rather than a words-per-token constant.
  #
  # CTX_SIZE is forwarded WITHOUT a default on purpose. bench_literal.py uses it
  # to refuse to build a prompt that would not fit, and a container-side default
  # would let the probe score an over-window refusal as a fidelity failure —
  # which is the exact mistake smoke_test.py's CTX_SIZE comment above records.
  # ---------------------------------------------------------------------------
  literal:
    profiles: ["tools"]
    image: qwen38-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    entrypoint: ["python", "/work/scripts/bench_literal.py"]
    environment:
      LLAMA_URL: http://llama:8080
      FORGE_URL: http://forge:8081
      MODEL_ALIAS: ${MODEL_ALIAS}
      CTX_SIZE: ${CTX_SIZE}
      LITERAL_TIMEOUT: ${LITERAL_TIMEOUT:-900}

  # ---------------------------------------------------------------------------
  # capture — the workstream tape. OFF unless FORGE_BACKEND_URL points at it.
  #
  #   ./scripts/capture.sh on      start it and repoint forge
  #   ./scripts/capture.sh off     repoint forge back and stop it
  #
  # In the default position (forge -> capture -> llama) the tape is what the
  # MODEL saw, which is the only tape a fidelity measurement can use: pi's
  # system prompt and tool schemas are on the wire by then, and so are forge's
  # own rewrites. See .env's capture section and
  # context/design/inference-divergence-and-this-stack.md §7.
  #
  # No published port. Nothing outside the compose network should reach it, and
  # a tape recorder that is reachable from the LAN is a transcript leak.
  #
  # The healthcheck probes /capture/health, which the proxy answers ITSELF and
  # never forwards — the same lesson forge's /forge/health records: a check that
  # relays the backend's readiness marks this container unhealthy for the whole
  # ~24 minute cold load of a model that is loading perfectly normally.
  # ---------------------------------------------------------------------------
  capture:
    profiles: ["capture"]
    image: qwen38-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    container_name: qwen38-capture
    restart: unless-stopped
    # root, for the same reason the downloader is run --user 0:0 against
    # MODELS_DIR: Docker Desktop presents a bind mount as root:root 0755, and
    # the image's `forge` user (uid 1000) cannot write to it. Found the honest
    # way — the first live run logged
    #     [capture] recorder write failed (PermissionError(13, ...)); proxying unaffected
    # and kept serving, which is the "a recording failure never fails a request"
    # guarantee doing its job on day one. The tape was empty and SAID so, rather
    # than a healthy-looking service quietly recording nothing.
    user: "0:0"
    entrypoint: ["python", "/work/scripts/capture_proxy.py"]
    command: >
      --upstream ${CAPTURE_UPSTREAM:-http://llama:8080}
      --listen-host 0.0.0.0
      --listen-port 8082
      --out-dir /captures
      --position ${CAPTURE_POSITION:-forge-llama}
      --max-bytes ${CAPTURE_MAX_BYTES:-8589934592}
      --upstream-timeout ${FORGE_BACKEND_TIMEOUT:-600}
    volumes:
      - "${CAPTURES_DIR}:/captures"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/capture/health', timeout=4).status==200 else 1)"
      interval: 15s
      timeout: 6s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # One-shot: read the tape. Runs INSIDE the compose network because --export
  # renders through llama's own /apply-template and tokenizes with its tokenizer.
  #   ./scripts/capture.sh index
  #   ./scripts/capture.sh export s7f3a91 --out /captures/corpus/deep.txt
  # ---------------------------------------------------------------------------
  sessions:
    profiles: ["tools"]
    image: qwen38-forge/proxy:${FORGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.forge
      args:
        FORGE_VERSION: ${FORGE_VERSION}
    # Same bind-mount ownership as the capture service above; --export writes
    # the corpus and its sidecar into /captures.
    user: "0:0"
    entrypoint: ["python", "/work/scripts/capture_sessions.py"]
    environment:
      LLAMA_URL: http://llama:8080
      CAPTURE_DIR: /captures
    volumes:
      - "${CAPTURES_DIR}:/captures"

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  slot-cache:
    name: qwen38-slot-cache

                      was refused cleanly with "exceeds the available context
                      size (65536 tokens)", so the window is enforced rather
                      than silently truncating.
                      Reasoning budget checked, not assumed: at REASONING_EFFORT
                      medium three prompts produced 77 / 900 / 636 chars of
                      reasoning against a 4096-token budget, all answers
                      correct, budget never hit. Not binding; left alone.

                      Outliers were discarded as contention, and then that was
                      PROVEN rather than assumed. Three bench runs came back at
                      1032 (16413), 418 and 908 (32797) while the host sat at
                      load average 16.5 on 16 cores with 146 MiB free and
                      another agent process at 191% CPU.
                      The control: llama's own print_timings_pp uses the SAME
                      stats.t_prompt_ms()/n_prompt_tps() the API reports, so
                      every prefill the engine ever ran is in its log. Across
                      155 prompt-processing lines spanning 8217 to 44507 tokens,
                      NO prefill was ever below 1900 tok/s -- the slow figures
                      have no counterpart in the engine's own accounting.
                      Once the host settled (load 6.6, 1.8 GiB free), three
                      consecutive 32797 runs gave 2243.4 / 2269.6 / 2200.7
                      tok/s with cache_n 0 on all three -- a spread of +-1.5%.

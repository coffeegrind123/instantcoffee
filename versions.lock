                      its scope, which a first pass got wrong.
                      (1) THE `bench` SERVICE DID NOT FORWARD CTX_SIZE, and
                      smoke_test.py defaulted it to a hardcoded 32768, making
                      the assertion `n_ctx >= 32768` — true for every window
                      this stack has run, while its own PASS line printed
                      ".env asks for 32768".
                      SCOPE, AND THE PART THE FIRST PASS GOT WRONG: this affected
                      smoke_test.py run via `--entrypoint python bench`, which is
                      NOT the documented way to run it and is not how any recorded
                      verification was taken. ./scripts/smoke-test.sh runs the
                      `smoketest` service, which has forwarded CTX_SIZE all
                      along, and re-running it 2026-08-23 prints "server reports
                      98304, .env asks for 98304". The `verified` and
                      `verified_at_96k` entries are therefore NOT undermined; a
                      first pass claimed they were, from one bad invocation
                      generalised to the tool. Retracted.
                      What was fixed and why it still matters: `bench` now
                      forwards CTX_SIZE and PARALLEL_SLOTS; the DEFAULT IS GONE,
                      so an unforwarded environment now FAILS loudly instead of
                      silently asserting something weaker than the check's name;
                      and the comparison is EQUALITY rather than >=, because >=
                      cannot tell "the flag was applied" from "the flag was
                      ignored and a larger window was already loaded" — a live
                      risk when probes recreate containers.
                      Controlled three ways: CTX_SIZE absent -> FAIL naming the
                      cause; CTX_SIZE=32768 against a 98304 server -> FAIL (>=
                      passed this); correct value -> PASS.
                      THE RULE, which is the durable part: a variable a container
                      uses as a TUNABLE may default; one it uses as a FACT ABOUT
                      THE STACK IT IS VERIFYING must not, because a default turns
                      a failed check into a passing weaker one.
                      (2) "no repeat loop (OpenAI tool call)" fed the WHOLE JSON
                      ENVELOPE to a generation-quality detector — this one is
                      real on EVERY path, including ./scripts/smoke-test.sh.
                      The trigger is `}}}`: a forge response ends
                      "prompt_tokens_details": {"cached_tokens": N}}}, so the
                      check reported "possible sampling regression" about JSON
                      punctuation. Not random — that field only appears once the
                      prefix cache has something to report, so the FIRST call
                      after a llama restart ends `}}` and passes and every warm
                      call after ends `}}}` and fails. Located at offset 608 of a
                      live envelope with nothing else in it repeating at all.
                      Now fed message.content plus the tool_calls' arguments,
                      which is what the plain-completion arm in the same file
                      always did — two callers of one helper, one got the hard
                      case. Smoke 11/11 on five consecutive runs since,
                      including the canonical ./scripts/smoke-test.sh.

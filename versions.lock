                      Keep K and V MATCHED whatever you choose; mismatched types
                      fall off the CUDA flash-attention path, which is the whole
                      reason this stack was stuck at 32K for ten days.
kv_accept_note      = MEASURED 2026-08-24, and it is a NULL WITH A STATED FLOOR.
                      THE CLAIM, from the 2026-08-24 HN thread on the XDA
                      reverse-engineering piece (Refefer): "KLD matters _a lot_
                      when it comes to its performance and it especially
                      manifests with MTP/DFlash acceptance rate". If true of KV
                      quantisation, the 4.7 % top-1 flip rate q8_0 KV costs
                      (kv_cache_fidelity) should show up as drafts the target
                      rejects — i.e. part of q8_0's throughput win handed back.
                      THE TEST. capacity-probe.sh --bench prefill, 32,000-token
                      prompt, 256 tokens generated per run, production spec
                      config untouched (ngram-simple,draft-mtp / n-max 4 /
                      p-min 0.40). Both arms at CTX_SIZE 65536, the ONLY
                      difference -ctk/-ctv. 64K rather than 96K because f16 does
                      not fit at 96K — that is the whole trade in section 4 of
                      inference-divergence-and-this-stack.md.
                        n=30 per arm     f16        q8_0      q8_0 - f16
                        acceptance     0.481      0.499        +0.0175
                          per-run sd  +/-0.061   +/-0.068     1.05 SE
                        draft/cycle     4.34       4.17        -0.172
                        decode t/s      54.2       51.5         -2.7 (-5.0 %)
                        prefill t/s     2141       2087          -54 (-2.6 %)
                        VRAM (MiB)     23014      21369        f16 +1645
                      READ IT AS: q8_0 KV costs NO MEASURABLE DRAFT ACCEPTANCE.
                      The difference is 1.05 SE and its SIGN IS BACKWARDS for the
                      claim — q8_0 accepted slightly MORE. Replicated: an
                      independent n=5 pass the same afternoon gave +0.0192
                      (0.36 SE), same sign, same size.
                      THE FLOOR IS THE POINT, because a null without one says
                      nothing: at n=30 this design resolves an acceptance shift
                      of 0.033 absolute (6.9 % relative) or larger. A penalty
                      smaller than ~3.3 points of acceptance would NOT have been
                      seen. The n=5 pass could only have seen 0.107 (20.7 %),
                      which is why it was re-run rather than reported.
                      draft/cycle FLIPPED SIGN between the two passes (+0.111
                      then -0.172), so it carries no signal here; quote
                      acceptance, not draft/cycle, for this comparison.
                      THE THROUGHPUT SIDE IS MESSIER THAN THE FIRST WRITE-UP OF
                      THIS ENTRY SAID, and the correction matters. Per-run:
                        pass   metric    f16      q8_0     diff      SE
                        n=5    prefill  2109.3   2094.5   -0.7 %    0.95
                        n=30   prefill  2141.3   2086.6   -2.6 %    8.26
                        n=5    decode     55.9     54.0   -3.3 %    0.50
                        n=30   decode     54.2     51.5   -5.0 %    1.84
                      Prefill variance is tight (sd 1.1-1.4 %, matching the
                      +/-1.5 % in spec_variance_note), so at n=30 the prefill
                      difference is RESOLVED WITHIN THAT PASS at 8.26 SE. But the
                      two passes disagree with EACH OTHER: -14.8 against -54.7
                      tok/s, about 2.4 SE apart. Both cannot be sampling noise
                      around one number.
                      READ IT AS: there is a BETWEEN-COLD-LOAD term that neither
                      pass can see, because each arm got exactly one load and the
                      load is therefore ALIASED ONTO THE ARM. Whatever differs
                      between two loads of the same config (allocator layout,
                      device state, other tenants) is being attributed to the KV
                      type. So do NOT quote -2.6 % as a q8_0 prefill penalty on
                      the strength of 8.26 SE; the SE is computed within the very
                      thing that is confounded.
                      THE FIX IS THE DESIGN, not more repeats: ALTERNATE the arms
                      across several cold loads (f16, q8_0, f16, q8_0, ...) so
                      load-to-load variation is averaged instead of aliased.
                      Until that is run, the honest statement is that q8_0 is
                      somewhere between 0.7 % and 2.6 % slower to prefill and 3-5
                      % slower to decode at 64K, direction reproduced twice,
                      magnitude unestablished.
                      NONE OF THIS TOUCHES THE ACCEPTANCE RESULT, which is a null
                      whose two passes AGREE (+0.0192 and +0.0175).
                      LIMITS. One depth (64K, 32K prompt) and one workload
                      (bench.py synthetic). kv_cache_fidelity's 4.7 % figure is
                      at n_ctx 4096/8192, so the fidelity and acceptance numbers
                      are not at the same depth. And the original claim was
                      about WEIGHT quant, which this box cannot vary — there is
                      no 8-bit alternative that leaves room for a 96K window.
draft_depth_note    = settled, and the 2026-08-17 open question is now CLOSED.
                      p-min was the binding knob, not n-max: at p-min 0.75 the
                      draft was cut to one token on ~70% of cycles (draft/cycle
                      1.30 against a ceiling of 2). Loosening p-min first is
                      what made raising n-max pay.
                      That entry closed with "draft/cycle still pins against the
                      ceiling at n-max 4 (3.79), so n-max 6/8 is untested and
                      may pay further". It was tested on 2026-08-22 and it does
                      NOT pay: n-max 6 and 8 are ~15% worse than 2-4. Depth
                      keeps rising (draft/cycle 4.80 at n6, 6.15 at n8) while
                      decode falls, because on a 4-bit quant each extra verified
                      token costs ~23.4% against 6.7% at BF16 (llama.cpp#27342).
                      draft/cycle pinning against the ceiling is therefore NOT
                      on its own a reason to raise n-max.
workstream_capture  = BUILT 2026-08-23. scripts/capture_proxy.py (a transparent
                      recording reverse proxy), scripts/capture_sessions.py
                      (rebuild workstreams from a flat tape, export a KLD
                      corpus, import pi's own transcripts),
                      scripts/capture.sh, the `capture` and `sessions` compose
                      services, 61 + 37 unit checks. Closes item 2 of
                      context/design/inference-divergence-and-this-stack.md §7,
                      which every remaining fidelity experiment was gated on.
                      Full account: context/design/workstream-capture.md.
                      OFF BY DEFAULT. Nothing records until `capture.sh on`,
                      which writes FORGE_BACKEND_URL into .env.local (gitignored
                      — a capture session cannot be committed by accident) and
                      recreates forge. `off` restores it. The KV cache lives in
                      llama, which does not move, so the flip costs seconds.
                      POSITION IS RECORDED ON EVERY LINE. forge-llama is what
                      the MODEL saw (system prompt, tool schemas and forge's own
                      rewrites all applied); client-forge is what the AGENT
                      asked for. Only the first can feed a fidelity measurement,
                      and a tape is not interpretable without knowing which it
                      is.
                      THE CORPUS IS PINNED TO THE SERVER'S OWN COUNTER. --export
                      renders through llama's /apply-template and tokenizes with
                      llama's tokenizer, then compares against
                      usage.prompt_tokens + usage.completion_tokens for that
                      request. Measured on a real 3-turn tool-calling capture:
                        naive prefill render   833 tokens (server said 905)  -72
                        sentinel-cut render    905 tokens (server said 905)   +0
                      The -72 is the whole tool call: this template emits a
                      tool_call block only for an assistant turn that is NOT
                      last, so the obvious render silently drops the one thing
                      the KLD run exists to look at. The exporter renders the
                      final turn in HISTORY position behind a sentinel and cuts
                      at the sentinel's own <|im_start|>.
                      USAGE IS DERIVED WHEN THE STREAM OMITS IT. llama sends no
                      `usage` in SSE unless asked, but `timings` carries the
                      counts. Verified as a matched pair: prompt_n 126 +
                      cache_n 383 == usage.prompt_tokens 509, predicted_n 226 ==
                      completion_tokens 226. Derived values are marked
                      derived_from:"timings". draft_n / draft_n_accepted land on
                      the same record, so per-request speculative acceptance is
                      now attributable to the prompt that caused it.
                      pi's OWN TRANSCRIPTS ARE A SECOND SOURCE, with named
                      limits. ~/.pi/agent/sessions/<slug>/*.jsonl — 706
                      recoverable turns on this box, deepest 93,876 prompt
                      tokens over 150 turns with 162 tool calls. They carry NO
                      system prompt and NO tool schemas (checked, not assumed),
                      so every imported record is stamped gaps:[system_prompt,
                      tool_schemas] and --export refuses them without
                      --allow-gaps. Also handled, each found by running against
                      real files: /loop injects user turns as `custom_message`;
                      pi's `input` EXCLUDES cacheRead (input+cacheRead+output ==
                      totalTokens, verified 829+10839+1159==12827); and
                      `compaction` records rewrite history.
                      THE GAP IS NOW A NUMBER, because the corpus control fired
                      on the first real export: the deepest imported session
                      (150 turns, 162 tool calls) tokenizes to 88,185 against
                      the 94,164 the server itself reported — delta -5,979,
                      exit code 1, SUSPECT. That is 6.3% of the prompt and it is
                      the tool block (`tools: 0` in the sidecar). A KLD run fed
                      from a transcript measures a prompt the model never saw.
                      --allow-gaps still writes the file for prose-at-depth
                      work; the exit code and the delta stay.
                      RUNS AS ROOT (user: "0:0"), same as the downloader against
                      MODELS_DIR: Docker Desktop presents a bind mount as
                      root:root 0755 and uid 1000 cannot write it. Found by the
                      recorder logging PermissionError and CONTINUING TO PROXY,
                      which is the guarantee it is built around.

forge_tool_call_path = MEASURED 2026-08-23, two defects and a cost, all from
                      matched pairs, and BOTH FIXED the same day by build-time
                      patches 4 and 5. Full account:
                      context/design/forge-on-the-tool-call-path.md.
                      NOT LIVE UNTIL A REBUILD: patches apply at image build
                      time, so the running containers keep the old behaviour
                      until `docker compose build forge`.
                      (1) ON A TOOL-CALL TURN THE MODEL'S TEXT NEVER REACHES THE
                      CLIENT. llama returned content "I'm going to look up the
                      current weather in Paris for you." plus reasoning plus the
                      call; forge returned the REASONING as content, no
                      reasoning_content key, and the sentence gone. Structural,
                      not a patch of ours: forge/proxy/convert.py's
                      tool_calls_to_openai builds its message from ToolCall
                      objects, and a forge ToolCall has a `reasoning` field and
                      no content field at all. Same hole
                      patches/forge_reasoning_passthrough.py already closed for
                      TextResponse; on an agent loop the tool-call path is
                      nearly every turn.
                      With FORGE_REASONING_REPLAY=full the reasoning arrives as
                      `content`, i.e. as a text block — which is exactly what
                      that patch's docstring says must not happen, because the
                      Matrix channel allowlists text blocks. keep-last puts it
                      in reasoning_content (leak closed) and content comes back
                      empty (sentence still lost). Measured both ways.
                      (2) forge MINTS NEW tool-call ids and RE-ENCODES arguments
                      (json.dumps of parsed args), so {"city":"Paris"} reaches
                      the client as {"city": "Paris"}. Values survive, bytes do
                      not. literal_fidelity's 224/224 stands — it scores parsed
                      VALUES — but this is a second reason, alongside the
                      grammar, that structural envelope failures are not
                      reachable through the forge path.
                      (3) forge REWRITES HISTORY: every user turn after the
                      first is folded into the first user message, so the newest
                      instruction arrives mid-prompt. Paired client-side and
                      model-side tapes of the same turn, 8 messages -> 6.
                      AND THAT PINS THE PREFIX CACHE. Three arms, one nonce
                      each so none warms another, cache_n from llama itself:
                        direct (no forge)   0/395   391/517   513/702
                        forge, keep-last    0/399   352/517   352/635
                        forge, full         0/396   349/582   349/754
                      Direct, the reused prefix GROWS with the conversation;
                      through forge it is pinned at the point the rewrite
                      begins. `full` also inflates the prompt (754 vs 702 vs
                      635 at turn 2) because replayed reasoning accumulates as
                      content. THREE SYNTHETIC TURNS AT ~700 TOKENS IS NOT
                      ENOUGH to overturn FORGE_REASONING_REPLAY=full, which was
                      set for KV-prefix reuse, and llama's checkpoints and
                      f_sim_best slot selection can salvage reuse this argument
                      does not see. The same measurement on a real captured
                      session is now one command away, and cache_n is on every
                      record.
                      THE FIXES, each measured against a SEPARATELY TAGGED test
                      image and a throwaway container, running stack untouched:
                      patches/forge_toolcall_content.py gives ToolCall a
                      `content` field, populates it at both native-mode client
                      sites through a helper that mirrors _resolve_reasoning's
                      priority order (so the text cannot be claimed twice), and
                      has both response builders emit content as `content` and
                      reasoning as `reasoning_content`. Matched triple: llama
                      "I'm going to look up the current weather in Paris.",
                      unpatched forge the REASONING, patched forge "I'll check
                      the current weather in Paris for you." plus the reasoning
                      in its own field. Streaming builder tested separately.
                      The replay policy survives and improves: the assistant
                      history message now reaches llama with BOTH content and
                      reasoning_content, so the replayed thinking renders inside
                      <think> where the model emitted it, instead of after
                      </think> as answer text — which is the first time the
                      preserve_thinking/KV-prefix argument is structurally
                      possible at all.
                      patches/forge_merge_across_tools.py restricts
                      _merge_consecutive to TRULY ADJACENT same-role messages
                      and puts the cross-tool case behind
                      FORGE_MERGE_ACROSS_TOOLS=1 (.env, default 0). That merge
                      is upstream's workaround for llama-server's MISTRAL
                      template parity checker; Qwen3.8's template has no such
                      constraint, verified against the live /apply-template.
                        arm                        turn1      turn2     msgs
                        direct (no forge)        391/517    513/702        8
                        forge, unpatched         349/582    349/754        6
                        forge, patched           392/518    514/703        8
                        forge, patched, flag ON      ...    350/697        6
                      The patched default reproduces the no-forge baseline to
                      within one token, and the flag brings the pinning straight
                      back, which is what makes that row a measurement. `full`
                      was also inflating the prompt (754 vs 703) by replaying
                      reasoning as content; patch 4 removes that for free.
                      smoke_test.py 11/11 against the patched build.
                      STILL NOT TOUCHED, knowingly: convert_anthropic.py has the
                      same hole in a starker form (reasoning appended as a
                      `text` block, model content never emitted) — this stack
                      speaks OpenAI, and the Anthropic wire needs a `thinking`
                      block shape decided first. Prompt-mode extraction is off
                      this stack's path (FORGE_CAPABILITY=native) and asks a

ngram_size_m_note   = LEAVE IT AT 48. Swept 2026-08-23 (context/bench/capacity/
                      sizem-*.json). VRAM is flat within 6 MiB across 48/32/24/
                      16, so there is nothing to reclaim, and lowering it only
                      truncates drafts: draft/cycle falls monotonically
                      24.98 -> 18.48 -> 14.61 -> 11.60. The default is both
                      cheaper and better. Mechanism confirmed in b10573 source:
                      common_speculative_n_max() (common/speculative.cpp:2283)
                      takes the MAX over enabled speculators, so ngram-simple's
                      size_m (48) overrides draft.n_max (4).
draft_kv_note       = REJECTED 2026-08-23. DO NOT SET -ctkd/-ctvd q8_0. The
                      "~180 MiB sitting there" DOES NOT EXIST; the flag costs
                      +216 MiB at 96K rather than saving 180.
                      What the earlier note got wrong: it read the draft KV line
                      and not the draft COMPUTE line directly beneath it.
                      Quantising the MTP head's KV drops the draft context off
                      its small specialised graph onto a full-width workspace —
                      the draft compute buffer becomes EXACTLY the main
                      context's compute buffer size.
                        96K  draft KV      384.00 -> 204.00   -180.00
                             draft compute 164.02 -> 560.28   +396.26
                             CUDA0 total 21173.64 -> 21389.90  +216.26
                        64K  draft KV      256.00 -> 136.00   -120.00
                             draft compute 132.02 -> 400.28   +268.26
                                                    net       +148.26
                      Sampled whole-device VRAM agrees and always did: 23019 ->
                      23233 at 96K (+214 against the engine's +216). The two
                      instruments were never in conflict — one of them was only
                      being read one line deep.
                      The 64K numbers come from the ORIGINAL 2026-08-22 logs,
                      kept as draftkv-*-contended.log. The evidence that refutes
                      the lever was on disk from the day it was proposed.
                      Decode was fine, which is why VRAM is the whole story:
                      96K re-run on an acceptable box gave 176.4 (spread 12.2%)
                      for the control against 174.4 (spread 10.9%) for q8_0,
                      draft/cycle 24.89 vs 24.39. Within noise on every axis.
                      Keep K and V MATCHED whatever you choose; mismatched types
                      fall off the CUDA flash-attention path, which is the whole
                      reason this stack was stuck at 32K for ten days.
draft_depth_note    = settled, and the 2026-08-17 open question is now CLOSED.
                      p-min was the binding knob, not n-max: at p-min 0.75 the
                      draft was cut to one token on ~70% of cycles (draft/cycle
                      1.30 against a ceiling of 2). Loosening p-min first is
                      what made raising n-max pay.
                      That entry closed with "draft/cycle still pins against the
                      ceiling at n-max 4 (3.79), so n-max 6/8 is untested and
                      may pay further". It was tested on 2026-08-22 and it does
                      NOT pay: n-max 6 and 8 are ~15% worse than 2-4. Depth
                      keeps rising (draft/cycle 4.80 at n6, 6.15 at n8) while
                      decode falls, because on a 4-bit quant each extra verified
                      token costs ~23.4% against 6.7% at BF16 (llama.cpp#27342).
                      draft/cycle pinning against the ceiling is therefore NOT
                      on its own a reason to raise n-max.

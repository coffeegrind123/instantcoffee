                      observed failure surface: a dotted hostname, a Cisco
                      interface, a UUID, a 40-hex commit, page_size=NNN, a
                      filesystem path, a 28-char mixed-case token, a service
                      name. Generated per run, so neither memorisation nor the
                      prefix cache can manufacture a pass.
                      STACK: b10573 / Dynamic V3 UD-Q4_K_XL / q8_0-q8_0 KV /
                      96K / spec on / effort none / through forge.
                        run  depths (tok)         calls  literals  non-exact
                        A    2000c, 4000              4        32          0
                        B    2000c, 16k/48k/90k x2   14       112          0
                        C    90000 x3, TEMP 1.0       6        48          0
                        D    2000c, 8000              4        32          0
                      224 field comparisons, ZERO corrupted. Run C is the
                      PRODUCTION sampler (temp 1.0 / top-p 0.95 / top-k 20);
                      A, B and D are greedy, which is the article's own argmax
                      framing.
                      THE NEGATIVE HAS ITS CONTROLS, both of them, because a
                      probe that scored everything `exact` unconditionally would
                      print exactly this output:
                      (1) SHALLOW CONTROL, on by default — the identical request
                      at ~2k tokens. A failure there is the prompt or the schema,
                      not depth. Clean in every run.
                      (2) DETECTION CONTROL — the real tool call from (1) is
                      re-scored against DELIBERATELY WRONG expectations, which
                      is symmetric with the model having made that mistake and
                      costs no extra call. All four corruption classes were
                      correctly flagged on live output (tail_swap, dropped_head,
                      truncated, case) while the same response still scored
                      exact against the true record.
                      WHAT IT DOES AND DOES NOT SAY. It says: on THIS stack, at
                      up to 90k, greedy and sampled, literals reach a tool
                      argument intact, and the q8_0 KV exposure discussed in
                      context/design/inference-divergence-and-this-stack.md §4
                      is not manifesting on this failure mode. It does NOT say
                      q8_0 KV is free — that needs the f16 arm, which does not
                      fit at 96K — and it does not measure prose or reasoning
                      quality at depth. It also cannot see structural envelope
                      failures the way the article did, because llama.cpp
                      grammar-constrains native tool calls once one is detected;
                      that is why every field here is a free-form STRING, which
                      is the part a grammar cannot protect.
                      RE-RUN IT after any change to CACHE_TYPE_K/V, CTX_SIZE,
                      the weights, or the spec config. It is cheap: the 90k arm
                      is ~55 s of prefill per unique document and the second
                      record on the same document is a cache hit at ~5 s.

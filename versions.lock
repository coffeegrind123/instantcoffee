                        q8_0 / f16                    0.9953      1.0016
                        Mean   KLD                   0.13697     0.21802
                        Median KLD                   0.00101     0.00108
                        99.0%  KLD                    3.2328      7.1081
                        Maximum KLD                  31.7209     33.7666
                        RMS Delta-p                   5.148 %     5.746 %
                        Same top-1                   95.284 %    94.087 %
                      READ IT AS: no perplexity penalty (under half a percent,
                      opposite signs), and a real tail. The median token moves
                      by KLD 0.001 and the 90th percentile by 0.026; the 99th is
                      3.2. Mean Delta-p is -0.014 % — unbiased — with RMS 5.1 %
                      and extremes at +/-99.999 %. 4.7 % of tokens change their
                      top-1 at 4096 and 5.9 % at 8192, against a control floor
                      of exactly 0.000 %.
                      DO NOT QUOTE `Mean PPL(Q)/PPL(base)`. It reads 1.164857
                      for q8_0-vs-f16 and 1.170322 in the NULL CONTROL — larger
                      with no quantisation at all. perplexity.cpp stores its base
                      log-probs as uint16 over a window clamped 16 nats below the
                      max logit, so any token with NLL above ~16.5 is recorded as
                      ~16.5 and Mean PPL(base) is biased low. Not a defect in the
                      run and not the "different scoring windows" explanation an
                      earlier handoff gave — perplexity.cpp:542 and :1792 both
                      use first = n_ctx/2.
                      REPRODUCIBLE run to run: the 4096 column came out identical
                      to every printed digit on 2026-08-23 and 2026-08-24, off two
                      independently written base logits files.
                      LIMITS, read from perplexity.cpp at b10573, not inferred.
                      (1) the corpus must hold 2*n_ctx tokens, so the deepest arm
                      a real session can support is CTX_SIZE/2 = 49,152 and the
                      64K the divergence document asked for is unreachable from
                      real traffic; (2) the ceiling is HOST RAM sized on
                      n_ctx*n_vocab — n_vocab 248,320 here, 15.16 GiB resident at
                      16384 and 60.6 GiB at 64K, on a 22 GiB box — VRAM never
                      binds; (3) perplexity tokenizes with parse_special=false
                      and has no flag for it, so both arms see <|im_start|> as
                      ordinary text (the COMPARISON is unaffected; the sequence
                      is not the serve-time one).
                      ONE THING IS OPEN AND IT IS NOT ABOUT THE KV CACHE.
                      PPL climbs with n_ctx on this corpus — 11.6055 at 4096,
                      16.0634 at 8192, 94.0000 at 16384 — which is backwards for
                      more context and is unexplained. Reproducible to four
                      decimals across runs. REFUSED so far: the logits path and
                      memory (the same pass with no logits file at all returns
                      the identical numbers), the batch count in both directions
                      (-c 4096 -b 512 -> 11.6055; -c 8192 -b 8192 -> 16.0634),
                      n_ctx_train (perplexity's own warning did not fire; the
                      GGUF says context_length 262144), flash attention and the
                      physical ubatch (-fa off: 93.0580 at 16384 and 11.5284 at
                      4096, about -1 % at BOTH depths; -ub 2048: 91.7255), and
                      one corpus's partition (pi-150turn degrades the same way,
                      x1.8 against x3.9). CANDIDATE MECHANISM, unproven: 48 of
                      the 64 layers are state-space with a FIXED-SIZE state, and
                      perplexity scores positions n_ctx/2..n_ctx-1, so raising
                      n_ctx raises how much history every scored token carries.
                      Until it is understood, do not compare absolute PPL across
                      depths on this stack. It does not touch the q8_0 result
                      above, which has its control.
                      A SECOND, SEPARATE DEFECT, now guarded: the 16384 base arm
                      wrote 594,062,932 bytes of an expected 16,272,437,236 and
                      EXITED 0. perplexity.cpp never checks the ofstream, so the
                      first short write latches badbit and every later write is
                      silently discarded. Not disk (7.7 TB free), not the kernel
                      2 GiB write cap (libstdc++ loops — a compiled probe issues
                      the identical 4,068,043,768-byte ostream::write to the same
                      9p directory and completes), not the mount. It is memory
                      pressure: that pass runs at ~15.2 GiB resident on a 22 GiB
                      box. verify_logits() now sizes the file against its own
                      header after every base pass; its four paths were exercised
                      against fabricated files.
                      LIMIT (3) IS NOW EXACT, 2026-08-24. perplexity_v2 prints
                      its token count unconditionally where the default mode
                      prints it only on the error path: deep-s26b5bb tokenizes to
                      70,053 tokens under parse_special=false, against llama's own
                      /tokenize count of 69,440 with specials parsed. So the cost
                      of the mismatch is +613 tokens, +0.88 % — the earlier
                      bracket of [69,632, 73,727] is closed.
                      THE DIRECT TEST OF THE DEPTH QUESTION WAS ATTEMPTED AND THE
                      ROUTE IS CLOSED. `llama-perplexity --ppl-stride` selects
                      perplexity_v2, whose scoring rule DOES hold history fixed
                      (chunk i scores the last `stride` tokens of a window, so two
                      windows score identical token sets offset by whole chunks —
                      read from perplexity.cpp:296-441 and confirmed against a
                      real run). It is unusable here for two independent reasons:
                      it decoded one 2048-token chunk in 144.35 s (14 tok/s
                      against the default mode's 558 tok/s on the same image and
                      weights — a 20x slowdown whose cause was NOT isolated), and
                      it accumulates n_ctx*n_vocab floats with no reserve() —
                      12.2 GiB peak at window 8192 — on top of 17.9 GB of weights
                      on a shared 22 GiB VM. IT DEADLOCKED THE WINDOWS HOST TWICE
                      and the operator had to recover the machine by hand. The
                      preflight had computed the 12,125 MiB peak correctly and
                      classified it TIGHT rather than REFUSED because swap covered
                      it on paper; that verdict is now a refusal, and
                      scripts/ppl-stride-run.sh is disarmed behind
                      --i-have-read-the-deadlock-note. DO NOT RE-RUN IT. A corpus
                      prefixed with filler, scored by the DEFAULT mode, would
                      answer the same question with the default mode's memory
                      profile. THAT ROUTE WAS TAKEN on 2026-08-24 and it works —
                      see depth_ppl below and §3e.
                      Full account: context/design/kv-cache-fidelity-measured.md.
depth_ppl           = MEASURED 2026-08-24 ON A MATCHED TOKEN SET, which is what
                      kv_cache_fidelity's depth note could not do.
                      THE CONFOUND, and why the obvious fix does not work.
                      llama-perplexity's default mode scores chunk j over offsets
                      [n_ctx/2+1, n_ctx-1] — THE WHOLE TOP HALF, never a subrange
                      — and emits one number for all of it
                      (perplexity.cpp:542-600, 629-633 at b10573). So n_ctx
                      changes WHICH tokens are scored as well as how much history
                      they carry, and no filler PLACEMENT separates a region from
                      the tokens that follow it in the same chunk.
                      THE INSTRUMENT. Prefix the corpus with EXACTLY n_ctx/2
                      tokens of filler and the pass scores the exact COMPLEMENT
                      of the unprefixed one. Two passes per depth; the union is
                      every corpus token once, at history [N/2+1, N-1], identical
                      at every depth. ./scripts/ppl-depth-run.sh, f16 KV, -b 2048,
                      no --kl-divergence-base, corpus deep-s26b5bb, analysis
                      window corpus [8192, 65536):
                        n_ctx    PPL      tokens    history      rotation spread
                         2048    6.3521   57,288   1025..2047          9.0 %
                         4096   12.2366   57,316   2049..4095         22.1 %
                         8192   57.9907   57,330   4097..8191       1441 %  <-- NOT
                                                              A NUMBER, see below
                      READ IT AS: 2048 -> 4096 is x1.93 in perplexity for x2 in
                      history on a token set that is 99.93 % identical. THE DEPTH
                      EFFECT IS REAL AND NOT A PARTITION ARTEFACT.
                      ROTATION SPREAD IS THE YARDSTICK and is worth more than any
                      argument: the two rotations at one depth score
                      COMPLEMENTARY halves — 50 % disjoint, the largest token-set
                      difference this design can make — at an identical history
                      distribution. 9 % and 22 % against a 93 % cross-depth
                      difference between arms that are 0.073 % disjoint.
                      FOUR CONTROLS RAN BEFORE ANY NUMBER WAS READ.
                      (1) The filler's length under PERPLEXITY'S OWN tokenizer,
                      off its error path — the only place default mode prints a
                      count: 70,053 for the corpus, and 71,077 / 72,101 / 74,149
                      for the arms, deltas exactly 1024 / 2048 / 4096. 70,053 also
                      independently reproduces what perplexity_v2 printed before
                      that route was closed.
                      (2) The whole-chunk alignment control: filler of a WHOLE
                      chunk must reproduce every per-chunk NLL shifted by one
                      chunk. 32 pairs at n_ctx 2048, worst 4.75e-4 relative =
                      0.72x the log's own four-decimal printing floor. PASS.
                      (3) The F=0 pass at 8192 returns Final estimate 16.0634 —
                      the figure the confounded ladder recorded for that depth, to
                      four decimals; and every one of its eight per-chunk running
                      values is byte-identical across two separate runs.
                      (4) All passes report batch_size=2048, n_seq=1.
                      AND 8192 HAS NO NUMBER, for a reason that belongs to the
                      corpus rather than the instrument. Four rotations there
                      (F = 0, 2048, 4096, 6144 — so {0,4096} and {2048,6144} are
                      two INDEPENDENT PARTITIONS of the same tokens) give arm
                      figures 14.77 / 36.58 / 227.67 / 48.98, and per-chunk
                      perplexity spans 2.54 to 1065.10 over six or seven chunks
                      per rotation. The two partitions disagree by a factor that
                      depends on the window and REVERSES DIRECTION between the
                      mean and the median (46.78 vs 41.85 aggregate; 35.66 vs
                      59.93 median) — the signature of too few draws from a heavy
                      tail, not of a resolved effect. So neither "history hurts
                      predictable text" nor "the chunk boundary fell badly" is
                      separable here.
                      IT IS NOT THE INSTRUMENT: the whole-chunk alignment control
                      was run again AT 8192 and passed at 1.36e-5 relative, 0.5x
                      the printing floor — tighter than the 2048 control — and
                      two rotations were re-run from scratch and reproduced their
                      eight per-chunk values BYTE FOR BYTE.
                      IT IS THE CORPUS. Limit (1) caps a captured workstream at
                      the server's own window, so 70,053 tokens give 34 chunks at
                      2048, 17 at 4096 and 8 at 8192, and the rotation spread
                      tracks that exactly: 9 % / 22 % / 1441 %. A number at 8192
                      needs a LONGER CORPUS, not a better instrument.
                      What survives: all four rotations exceed the 4096 arm's
                      12.24, so the trend continues past 4096 with its size
                      undetermined.
                      MEMORY, MEASURED RATHER THAN DERIVED: at n_ctx 8192 the
                      preflight predicts 3880 MiB resident and the container's
                      cgroup showed 4198 MiB anon (+8.2 %) plus 2737 MiB of
                      reclaimable page cache, host free bottoming at 158 MiB with
                      ZERO swap used. The guard now carries that 10 % as a
                      measured margin. Nothing here approaches the 12.2 GiB that
                      took the host down; this is the default mode, and
                      ppl-stride-run.sh stays disarmed.
                      Records: context/bench/ppl-depth/*.json.
                      Full account: context/design/kv-cache-fidelity-measured.md
                      §3e.

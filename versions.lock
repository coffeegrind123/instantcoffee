                      a settled box, and decode is the limiting metric for any
                      A/B. For spec-config comparisons prefer draft/cycle,
                      which is a property of the drafting rather than the clock.
                      This is the trap spec_variance_note describes; the control
                      is to re-run and to cross-check the engine's own log, not
                      to believe one number.

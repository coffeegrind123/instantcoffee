kv_cache            = q8_0/q8_0 (CHANGED 2026-08-22; MEASURED — prefill four
                      digits and rising with depth, see verified). Previous
                      f16/f16 entry read "quantized V takes prefill off the
                      GPU"; the real rule is that a stock CUDA build compiles
                      only MATCHED flash-attention KV pairs, so f16 K with q8_0
                      V fell to the CPU. Matched q8_0/q8_0 is a compiled kernel.
                      4-bit KV stays off the table: llama.cpp#27109 (open) has
                      q4_x collapsing prefill to 34-106 t/s on this exact
                      qwen35 hybrid architecture, against 991-1276 t/s at q8_0.
                      READ 2026-08-24 OUT OF THE GGUF, AND IT SCOPES EVERY
                      SENTENCE ABOVE: qwen35 is a HYBRID, and only 16 of its 64
                      layers have a KV cache at all. `full_attention_interval=4`
                      — blocks 3, 7, 11 ... 63 carry attn_q/attn_k; the other 48
                      carry ssm_* and a FIXED-SIZE recurrent state (conv_kernel 4,
                      state_size 128, group_count 16, inner_size 6144) that -ctk
                      / -ctv do not touch and cannot. Confirmed against the
                      tensor table, not just the metadata keys. So "q8_0 KV" here
                      quantises a QUARTER of the model's state, and the fidelity
                      numbers in kv_cache_fidelity should be read as the cost of
                      that quarter — the article this stack compares itself
                      against measured dense transformers, where the same flag
                      would touch four times as much.

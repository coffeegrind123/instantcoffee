# Pins plus the measurements that justify them. Commit it: it is the record of
# what was actually verified working.
#
# This branch serves pi through the hosted Anthropic API, so the local-model
# pins (the llama.cpp image, the GGUF files, forge, and every context / KV /
# spec-decoding setting measured for them) were removed with the layer that
# served them. What remains pins only what this branch still ships.

observe_commit      = abfe6aa
observe_commit_note = The vendor/instantcoffee-observe submodule commit the
                      dashboard image is built from (instantcoffee/observe:
                      <commit>). The submodule itself is the pin; this line
                      records it where the rest of the stack is recorded.

rtk_version         = 0.45.0
rtk_filters         = allow-list verified

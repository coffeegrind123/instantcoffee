name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── lint + syntax ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      # Pinned because both TypeScript steps below rely on type stripping, which
      # landed in Node 22.6 — on an older runner image they would fail as a
      # missing flag rather than as the problem they are meant to catch.
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Python syntax checks
        run: |
          for f in scripts/smoke_test.py scripts/test_repeat_detector.py \
                   scripts/ab_think_lang.py scripts/test_cjk_detector.py \
                   scripts/download_model.py scripts/browser_cli.py \
                   scripts/test_browser_cli.py scripts/capture_proxy.py \
                   scripts/capture_sessions.py scripts/test_capture_proxy.py \
                   scripts/test_forge_patches.py \
                   scripts/bench_tools.py \
                   scripts/test_download_verify.py; do
            python -c "import py_compile; py_compile.compile('$f', doraise=True)"
            echo "  $f: OK"
          done

      - name: Shell syntax checks
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "  $f: OK"
          done

      # pi loads .pi/extensions/*.ts at startup. A parse error there does not
      # fail loudly — the session simply comes up without /stack — so it is
      # checked here instead. Node's type stripping is a parser, not a type
      # checker, which is the right depth: it catches syntax and any construct a
      # strip-only transpiler cannot handle (parameter properties, enums), while
      # needing no toolchain and no node_modules.
      - name: Extension syntax checks
        run: |
          for f in .pi/extensions/*.ts vendor/rtk-pi/extensions/*.ts vendor/pi-persona/extensions/*.ts; do
            node --experimental-strip-types --no-warnings \
                 -e "import('./$f').catch(e => {
                       if (e.code === 'ERR_MODULE_NOT_FOUND') process.exit(0);
                       console.error(e.message); process.exit(1);
                     })"
            echo "  $f: OK"
          done

      # The rtk fork's gate decides which bash commands get their output
      # rewritten before pi sees it. Its failure mode is silent in both
      # directions: too permissive and a command is quietly replaced by a
      # different one (`npm run lint` -> a bare eslint), too strict and the
      # savings evaporate with nothing to show for it. Neither shows up in a
      # session. src/gate.ts imports nothing from pi precisely so this can run
      # with no node_modules.
      # The extension SUITES, which nothing ran until 2026-08-24: the syntax
      # check above proves they parse, and seven compaction-guard test files
      # (75 assertions) plus the browser guard's own had never been executed by
      # CI at all. The browser guard's is the one that matters most — it pins
      # that a browser tool FAILURE is recognised from its text rather than from
      # `isError`, which pi sets only when a tool throws, and which the browser
      # MCP server therefore never sets.
      - name: Extension unit tests
        run: |
          node --experimental-strip-types --no-warnings --test \
            .pi/extensions/tests/*.test.ts \
            .pi/extensions/compaction-guard/tests/*.test.ts

      # pi is installed HERE rather than at the Matrix step further down,
      # because the rtk suite drives pi's real `execCommand` to establish what a
      # killed child actually resolves to — a stub of it would assert the shape
      # the code already assumes and prove nothing. Without pi on PATH that one
      # test skips, and the premise behind the whole AB3 finding goes unchecked
      # in CI. (It used to HARD FAIL on an absolute path that only existed on
      # the author's box, which took every step after it down with it.)
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: rtk gate unit tests
        working-directory: vendor/rtk-pi
        run: node --experimental-strip-types --no-warnings --test tests/*.test.ts

      # /persona is a port carried in this repo (vendor/pi-persona/FORK.md), so
      # its regressions are ours. Two failure modes make it worth a CI step of
      # its own, and neither is visible from inside a session:
      #
      #   - The block is PREPENDED to pi's system prompt and is ~3,683 tokens of
      #     every request. An edit that changes that number changes how much of a
      #     32k window is left for the user's code, silently. The suite pins both
      #     mode's sizes inside a band.
      #   - The block builds its tool references from what pi says is selected
      #     THIS turn. Hardcoding a tool pi does not have is how a model ends up
      #     inventing a URL rather than fetching one, and it fails as a
      #     plausible-looking answer rather than as an error.
      #
      # Runs after `Install pi`: the extension suite redirects pi's bare
      # specifier onto the installed package so the factory runs against the same
      # import a session would. Without pi those tests skip and the source
      # assertions still run, so this step is green either way — but the point of
      # putting it here is that they do not skip.
      - name: Persona port unit tests
        working-directory: vendor/pi-persona
        run: |
          npm run lint
          npm test

      # The other half of the same contract: that the rtk BINARY still behaves
      # the way the allow-list assumes. Filters are upstream's to change and a
      # filter that stops rewriting, or starts summarising a file read, does it
      # without a version bump anyone here would notice. Pinned version, so this
      # is deterministic; it is what catches the pin being raised carelessly.
      - name: rtk filters still match the allow-list
        run: |
          ./scripts/rtk.sh --install
          ./scripts/rtk.sh --check

      # The stack targets pi only, and no longer carries a scored eval harness.
      # A reintroduced Claude Code launcher, env key or wire-format check would
      # go unnoticed otherwise until someone tried to run it against a 64K
      # window; a reintroduced eval.py would quietly bring back a scorecard,
      # badges and a results/ directory that were deliberately deleted.
      - name: No Claude Code support or eval harness has crept back in
        run: |
          for f in scripts/claude-local.sh scripts/claude-code-env.sh \
                   harbor-adapter/forge_claude.py scripts/eval.py \
                   scripts/eval_harness.py scripts/run-eval.sh; do
            test ! -e "$f" || { echo "REMOVED FILE IS BACK: $f"; exit 1; }
          done
          ! grep -qE '^CLAUDE_' .env || { echo ".env has CLAUDE_* keys again"; exit 1; }
          echo "  pi-only: OK"

      - name: Repeat detector unit tests
        run: python scripts/test_repeat_detector.py

      - name: CJK leak detector unit tests
        run: python scripts/test_cjk_detector.py

      # download_model.py's content check only fires on a BAD download, which is
      # the one case running the real script on a good file cannot reach. These
      # fixtures are a few bytes each so the failure paths are actually
      # exercised — including size-matches-but-content-does-not, which the
      # size-only comparison this replaced could never catch.
      - name: Model download verification unit tests
        run: python scripts/test_download_verify.py

      # The capture proxy sits in the production path between forge and llama, so
      # two of its promises are the kind that fail silently and both have a
      # control that can FAIL: an upstream that sleeps mid-stream (catching any
      # future edit that buffers the body), and a recorder that raises on every
      # write, checked down a KEEP-ALIVE connection because the damage only
      # shows on the second request. No server, no GPU, no compose.
      - name: Capture proxy unit tests
        run: python scripts/test_capture_proxy.py

      # The session rebuilder decides what a workstream IS out of a flat tape,
      # and the corpus exporter decides what the KLD run will measure. A silent
      # regression there produces a plausible corpus that is not the token
      # stream the model saw.
      - name: Capture session rebuilder unit tests
        run: python scripts/capture_sessions.py --self-test

      # The browser CLI turns shell words into JSON arguments for a tool it has
      # never seen, from that tool's own schema. A regression there is silent:
      # a dropped or mistyped parameter produces a call that succeeds and does
      # the wrong thing. No server or browser is needed for these.
      - name: Browser CLI unit tests
        run: python scripts/test_browser_cli.py

      # /loop is a fork carried in this repo (vendor/pi-loop-mode/FORK.md), so its
      # regressions are ours. The suite drives the extension's real handlers
      # through the context-overflow race the fork exists to fix — a break there
      # would otherwise only show up hours into an unattended run.
      - name: Loop-mode fork unit tests
        working-directory: vendor/pi-loop-mode
        run: |
          npm run lint
          npm test

      # The Matrix channel is a conversion carried in this repo
      # (vendor/prinny-channel/FORK.md), so its regressions are ours too. Its
      # failure mode is the one worth catching in CI: a broken channel does not
      # error, it just stops delivering, and the only witness is somebody on
      # Matrix wondering why the bot ignores them.
      #
      # The sidecar's Matrix dependencies are installed and compiled outside the
      # repo, which is what --prepare does. The suite runs against that compiled
      # output rather than a re-compile of it, so this step is not optional
      # setup — it builds the artifact under test.
      - name: Matrix channel — build the sidecar runtime
        working-directory: vendor/prinny-channel
        run: node server/bin/prinny-channel.mjs --prepare

      - name: Matrix channel unit tests
        working-directory: vendor/prinny-channel
        run: |
          npm run lint
          npm run test:unit

      # Separate, and after pi is installed, so "pi would not install" is not
      # reported as "the extension is broken". This is the step that catches a
      # wrong notification method name — the extension's whole job, and
      # something no unit test can see.
      - name: Matrix channel — the extension inside a real pi
        run: cd vendor/prinny-channel && npm run test:e2e

      # A fragment that is empty, or that forgets to pin the output language,
      # would quietly turn THINK_LANG into "answer in Chinese".
      - name: System-prompt fragments are well formed
        run: |
          for f in prompts/think-*.md; do
            test -s "$f" || { echo "EMPTY: $f"; exit 1; }
            grep -qi "user's language\|English" "$f" \
              || { echo "$f does not pin the output language"; exit 1; }
            echo "  $f: OK"
          done

      - name: .env key validation
        run: |
          required=( CTX_SIZE NGL FLASH_ATTN
                     LLAMA_EXTRA_FLAGS TEMPERATURE TOP_P TOP_K MIN_P
                     REASONING_BUDGET FORGE_CAPABILITY FORGE_REASONING_REPLAY
                     CACHE_PROMPT CACHE_RAM MODEL_ALIAS MODEL_REPO GGUF_FILE
                     LLAMA_PORT FORGE_PORT THINK_LANG REASONING_EFFORT
                     PI_MAX_TOKENS PI_CONTEXT_FILES
                     MCP2CLI_ENABLED MCP2CLI_VERSION MCP_SDK_VERSION
                     BROWSER_MCP_ENABLED ZENDRIVER_MCP_DIR BROWSER_MCP_HOST
                     BROWSER_MCP_PORT BROWSER_MCP_DISPLAY BROWSER_MCP_AUTOSTART
                     BROWSER_MCP_TIMEOUT
                     MCP_ADAPTER_ENABLED MCP_ADAPTER_VERSION BROWSER_MCP_AUTOUP
                     RTK_ENABLED RTK_VERSION )
          missing=0
          for key in "${required[@]}"; do
            if ! grep -qE "^${key}=" .env; then
              echo "MISSING: $key"
              missing=1
            fi
          done
          exit $missing

      # A mode is applied with env_set(), which refuses to append a key that is
      # not already in .env — so a typo in modes/*.env fails at switch time, in
      # front of whoever is trying to change regime, having already written some
      # of the keys. Catch it here instead. Also guards the reverse drift: a key
      # renamed in .env leaves every mode file silently pointing at nothing.
      - name: Mode presets reference real .env keys
        run: |
          bad=0
          for f in modes/*.env; do
            [ -e "$f" ] || continue
            while IFS= read -r key; do
              grep -qE "^[[:space:]]*${key}=" .env || { echo "$f: '$key' is not in .env"; bad=1; }
            done < <(grep -E '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=' "$f" | sed 's/=.*//' | tr -d ' \t')
            echo "  $f: $(grep -cE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=' "$f") keys"
          done
          exit $bad

      # .env is rewritten by scripts/mode.sh, so a comment that asserts which
      # regime is active goes stale the moment anyone switches. This repo shipped
      # a block reading "CURRENTLY SET FOR PROSE" above the coding temperature.
      # Describe the knob, not the current value.
      - name: .env comments do not assert the active mode
        run: |
          if grep -nEi '^#.*(currently set|is currently (on|off))' .env; then
            echo "The lines above claim a live state in a file that mode.sh rewrites."
            exit 1
          fi
          echo "  no mode-state assertions in .env comments: OK"

      # The skill is the only thing that tells the model ./scripts/mcp.sh
      # exists, and pi is lenient about malformed skills — it does not fail, it
      # just quietly does not offer them. So validate the frontmatter here
      # instead of finding out mid-session.
      - name: Agent skills are well formed
        run: |
          pip install --quiet pyyaml
          python - <<'EOF'
          import re, sys, pathlib, yaml
          bad = 0
          for p in pathlib.Path("skills").glob("*/SKILL.md"):
              err = 0
              text = p.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  print(f"{p}: no YAML frontmatter"); bad = 1; continue
              # Parsed as real YAML, not split on the first colon. A ": " inside
              # an unquoted description is a nested mapping to a YAML parser and
              # pi drops the whole skill — which is exactly how this repo shipped
              # two unloadable skills whose frontmatter a split(":") check liked.
              try:
                  fm = yaml.safe_load(m.group(1))
                  if not isinstance(fm, dict):
                      raise ValueError(f"frontmatter is {type(fm).__name__}, not a mapping")
              except Exception as e:
                  print(f"{p}: frontmatter is not valid YAML: {str(e).splitlines()[0]}")
                  bad = 1
                  continue
              fm = {k: str(v) for k, v in fm.items()}
              name, desc = fm.get("name", ""), fm.get("description", "")
              if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name) or len(name) > 64:
                  print(f"{p}: invalid name {name!r}"); err = 1
              if not desc or len(desc) > 1024:
                  print(f"{p}: description missing or over 1024 chars"); err = 1
              if len(text) - m.end() < 200:
                  print(f"{p}: body is suspiciously short"); err = 1
              bad |= err
              if not err:
                  print(f"  {p}: OK (name={name}, description={len(desc)} chars)")
          sys.exit(bad)
          EOF

      # A server entry with both transports, or neither, only fails when the
      # model reaches for it mid-task.
      - name: MCP server registry is well formed
        run: |
          python - <<'EOF'
          import json, sys
          reg = json.load(open("mcp/servers.json", encoding="utf-8"))
          bad = 0
          servers = {k: v for k, v in (reg.get("servers") or {}).items() if not k.startswith("_")}
          for name, e in servers.items():
              has = [k for k in ("stdio", "url") if e.get(k)]
              if len(has) != 1:
                  print(f"  {name}: needs exactly one of stdio/url, has {has}"); bad = 1
              else:
                  print(f"  {name}: OK ({has[0]})")
              for v in ([e["auth_header"]] if isinstance(e.get("auth_header"), str)
                        else (e.get("auth_header") or [])):
                  # A literal secret in a committed file is the failure mode worth
                  # catching automatically; env:/file: indirection is the fix.
                  if ":env:" not in v and ":file:" not in v:
                      print(f"  {name}: auth_header must use env: or file:, not a literal"); bad = 1
          sys.exit(bad)
          EOF

      # The browser must not come back as an mcp2cli server: measured at 11-60 s
      # per call against 25-417 ms through the adapter, with a per-URL tool-list
      # cache that serves a stale surface after the server changes. mcp/servers.json
      # explains this in _no_browser_entry; this keeps it true.
      - name: The browser is not registered as an mcp2cli server
        run: |
          python - <<'EOF'
          import json, sys
          reg = json.load(open("mcp/servers.json", encoding="utf-8"))
          servers = reg.get("servers") or {}
          port = None
          for line in open(".env", encoding="utf-8"):
              if line.startswith("BROWSER_MCP_PORT="):
                  port = line.split("=", 1)[1].strip()
          for name, entry in servers.items():
              target = entry.get("url") or entry.get("stdio") or ""
              if name == "browser" or (port and port in target):
                  print(f"'{name}' points the mcp2cli path at the browser: {target}")
                  sys.exit(1)
          print("  no browser entry in the mcp2cli registry: OK")
          EOF

      # mcp/adapter.json is what pi-mcp-adapter reads (--mcp-config). Two ways it
      # can rot silently: a hardcoded URL that drifts from the port browser.sh
      # binds, and an empty directTools list — which still "works", it just
      # quietly demotes the whole browse loop to proxy calls.
      - name: Browser adapter config is well formed
        run: |
          python - <<'EOF'
          import json, re, sys
          cfg = json.load(open("mcp/adapter.json", encoding="utf-8"))
          env = open(".env", encoding="utf-8").read()
          bad = 0
          server = (cfg.get("mcpServers") or {}).get("browser")
          if not server:
              print("no 'browser' server in mcp/adapter.json"); sys.exit(1)
          url = server.get("url", "")
          for var in ("BROWSER_MCP_HOST", "BROWSER_MCP_PORT"):
              if "${%s}" % var not in url:
                  # Built rather than written literally: a "${" followed by "{"
                  # anywhere in this file is an Actions expression, and the run
                  # fails before a step starts.
                  want = "$" + "{" + var + "}"
                  print(f"url must interpolate {want}, got {url!r}"); bad = 1
              if not re.search(rf"^{var}=", env, re.M):
                  print(f"{var} is not in .env"); bad = 1
          direct = server.get("directTools")
          if not isinstance(direct, list) or not direct:
              print("directTools must be a non-empty list"); bad = 1
          elif "start_browser" in direct:
              print("start_browser is 2.3KB of schema; the server auto-starts instead"); bad = 1
          guard = (cfg.get("settings") or {}).get("outputGuard") or {}
          if guard.get("maxBytes", 51200) > 16384:
              print("outputGuard.maxBytes is sized for a 200K window, not 32K"); bad = 1
          print(f"  adapter config: OK ({len(direct)} direct tools, url {url})")
          sys.exit(bad)
          EOF

      # The pin is what keeps mcp2cli working at all: SDK 2.0.0 renamed
      # Tool.inputSchema to input_schema and mcp2cli 3.3.1 still reads the old
      # name, so an unpinned install breaks every MCP call.
      - name: MCP SDK stays pinned below 2.0
        run: |
          v=$(grep -oP '(?<=^MCP_SDK_VERSION=).*' .env)
          case "$v" in
            1.*) echo "  mcp SDK pinned at $v: OK" ;;
            *)   echo "MCP_SDK_VERSION=$v — mcp2cli 3.3.1 needs mcp<2 (Tool.inputSchema)"; exit 1 ;;
          esac

      - name: Docker Compose config validation
        run: |
          docker compose config > /dev/null && echo "compose: OK"
          docker compose --profile tools config > /dev/null && echo "tools: OK"

      # -n is the server-side generation cap: a client that sends
      # max_completion_tokens instead of max_tokens gets no limit at all, since
      # llama.cpp reads only the latter. It has to match the cap pi is told
      # about, or the two disagree silently.
      - name: Generation cap agrees between llama-server and pi
        run: |
          # Piped, not <(...): grep -P against a process-substitution fd was
          # observed returning no match for a pattern that matches on a pipe.
          n_flag=$(grep '^LLAMA_EXTRA_FLAGS=' .env | grep -oP '(?<=-n )[0-9]+' || true)
          pi_max=$(grep -oP '(?<=^PI_MAX_TOKENS=)[0-9]+' .env || true)
          test -n "$n_flag" || { echo "LLAMA_EXTRA_FLAGS has no -n cap"; exit 1; }
          test "$n_flag" = "$pi_max" \
            || { echo "-n $n_flag != PI_MAX_TOKENS $pi_max"; exit 1; }
          echo "  generation cap: $n_flag on both sides: OK"

  # ── build + dry-run + badge (single job so docker load works) ──────────
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # .env IS the source of truth for this, as it is for everything else the
      # scripts read through `env_get`. It used to be
      # `${{ vars.FORGE_VERSION || '0.8.2' }}` — a repository variable that is
      # not set, so every CI build used the literal fallback. That fallback went
      # stale: .env moved to 0.9.0 and CI kept building 0.8.2, so the image CI
      # tested was never the image this repo targets.
      #
      # It surfaced as a patch refusing, which is the patches working exactly as
      # designed — `forge_cached_tokens` looks for a TokenUsage construction that
      # 0.8.2 does not contain and stops the build rather than shipping
      # unpatched. Reading the version from .env means CI cannot build a
      # different forge from the one the operator runs.
      - name: FORGE_VERSION from .env
        id: forge
        run: |
          v="$(grep -E '^FORGE_VERSION=' .env | tail -n1 | cut -d= -f2)"
          test -n "$v" || { echo ".env has no FORGE_VERSION"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "  building forge $v"

      - name: Build forge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.forge
          build-args: FORGE_VERSION=${{ steps.forge.outputs.version }}
          load: true
          tags: instantcoffee/proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The ten build-time patches already fail the BUILD when forge's source
      # text moves. That is a check on the input: a patch can apply cleanly to
      # text that has shifted underneath it and produce a package that imports,
      # starts, serves, and returns the wrong field — which is the shape of
      # every defect they exist to fix. This drives the patched functions.
      - name: Forge patch behaviour
        run: |
          docker run --rm --entrypoint python instantcoffee/proxy:ci \
            /work/scripts/test_forge_patches.py

      - name: Verify scripts in image
        run: |
          docker run --rm --entrypoint ls instantcoffee/proxy:ci /work/scripts/ \
            | tee /dev/stderr \
            | grep -q smoke_test.py

      # The A/B harness reads the fragment from inside the image, so a missing
      # COPY would only surface as a run-time crash on a machine with a GPU.
      - name: Verify prompt fragments in image
        run: |
          docker run --rm --entrypoint ls instantcoffee/proxy:ci /work/prompts/ \
            | tee /dev/stderr \
            | grep -q think-zh.md
          docker run --rm --entrypoint python instantcoffee/proxy:ci \
            /work/scripts/ab_think_lang.py --help > /dev/null && echo "ab harness: OK"

      - name: Verify smoke_test.py imports and has check_for_repeats
        run: >
          docker run --rm --entrypoint python instantcoffee/proxy:ci
          -c "import ast; tree=ast.parse(open('/work/scripts/smoke_test.py').read()); fns=[n.name for n in ast.walk(tree) if isinstance(n,ast.FunctionDef)]; print('smoke_test fns:',fns); assert 'check_for_repeats' in fns"

      # ── badge (main push only) ────────────────────────────────────────
      - name: Generate CI badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p badges
          cat > badges/ci.json << 'ENDJSON'
          {
            "schemaVersion": 1,
            "label": "ci",
            "message": "passing",
            "color": "brightgreen",
            "namedLogo": "githubactions",
            "style": "flat"
          }
          ENDJSON

      - name: Commit badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/ci.json
          if git diff --cached --quiet; then
            echo "No badge changes"
          else
            git commit -m "ci: update CI badge [skip ci]"
            git push
          fi

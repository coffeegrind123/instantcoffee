name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# This branch serves pi from the hosted Anthropic API. There is no llama.cpp
# image to build and no forge to patch, so what is left is lint plus the suites
# that need no model: the extensions pi loads, the vendored forks, the surviving
# scripts, and the config files a session reads. Nothing here needs a GPU,
# because nothing here runs one.
jobs:
  # ── lint + syntax + the no-model suites ────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/pi-persona and vendor/prinny-channel are submodules. Without
          # this they are empty directories, the syntax checks silently find no
          # file to check, and the persona/prinny steps fail on a missing
          # package.json — which reads as a broken package rather than a
          # missing checkout flag.
          submodules: recursive

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      # Pinned because the TypeScript steps rely on type stripping, which landed
      # in Node 22.6 — on an older runner image they would fail as a missing
      # flag rather than as the problem they are meant to catch.
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # The glob is deliberate rather than a hand-kept list, so a new script is
      # covered the moment it lands. A glob that matches nothing expands to the
      # literal pattern and py_compile fails on a file that is not there — an
      # empty suite is loud, not green.
      - name: Python syntax checks
        run: |
          for f in scripts/*.py; do
            python -c "import py_compile; py_compile.compile('$f', doraise=True)"
            echo "  $f: OK"
          done

      - name: Shell syntax checks
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "  $f: OK"
          done

      # pi loads .pi/extensions/*.ts at startup. A parse error there does not
      # fail loudly — the session simply comes up without the extension — so it
      # is checked here instead. Node's type stripping is a parser, not a type
      # checker, which is the right depth: it catches syntax and any construct a
      # strip-only transpiler cannot handle, while needing no toolchain and no
      # node_modules.
      #
      # The submodules, asserted rather than assumed. An absent vendor/pi-persona
      # does not fail the checks below — it fails them UPWARDS: the glob does not
      # expand, `$f` stays the literal pattern, the import throws
      # ERR_MODULE_NOT_FOUND, and that branch deliberately exits 0. So a missing
      # `submodules: recursive` would present as a green run that checked
      # nothing. A negative result needs a control; this is it.
      - name: The submodules are checked out
        run: |
          for m in pi-persona prinny-channel instantcoffee-observe; do
            test -f "vendor/$m/package.json" \
              || { echo "vendor/$m is empty — checkout needs submodules: recursive"; exit 1; }
            echo "  vendor/$m: present at $(git -C "vendor/$m" rev-parse --short HEAD)"
          done
          test -f vendor/pi-persona/extensions/index.ts || { echo "no persona extension"; exit 1; }
          test -f vendor/prinny-channel/extensions/index.ts || { echo "no prinny extension"; exit 1; }
          test -f vendor/instantcoffee-observe/Dockerfile || { echo "no observe Dockerfile"; exit 1; }

      - name: Extension syntax checks
        run: |
          for f in .pi/extensions/*.ts vendor/rtk-pi/extensions/*.ts vendor/pi-persona/extensions/*.ts; do
            node --experimental-strip-types --no-warnings \
                 -e "import('./$f').catch(e => {
                       if (e.code === 'ERR_MODULE_NOT_FOUND') process.exit(0);
                       console.error(e.message); process.exit(1);
                     })"
            echo "  $f: OK"
          done

      # The extension SUITES. The browser guard's is the one that matters most —
      # it pins that a browser tool FAILURE is recognised from its text rather
      # than from `isError`, which pi sets only when a tool throws, and which the
      # browser MCP server therefore never sets.
      - name: Extension unit tests
        run: |
          node --experimental-strip-types --no-warnings --test \
            .pi/extensions/tests/*.test.ts \
            .pi/extensions/compaction-guard/tests/*.test.ts \
            .pi/extensions/observe/tests/*.test.ts

      # pi is installed HERE rather than at the Matrix step further down,
      # because the rtk suite drives pi's real `execCommand` to establish what a
      # killed child actually resolves to — a stub of it would assert the shape
      # the code already assumes and prove nothing. Without pi on PATH that one
      # test skips, and the premise behind the whole AB3 finding goes unchecked
      # in CI.
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      # The rtk fork's gate decides which bash commands get their output
      # rewritten before pi sees it. Its failure mode is silent in both
      # directions: too permissive and a command is quietly replaced by a
      # different one (`npm run lint` -> a bare eslint), too strict and the
      # savings evaporate with nothing to show for it. src/gate.ts imports
      # nothing from pi precisely so this can run with no node_modules.
      - name: rtk gate unit tests
        working-directory: vendor/rtk-pi
        run: node --experimental-strip-types --no-warnings --test tests/*.test.ts

      # The other half of the same contract: that the rtk BINARY still behaves
      # the way the allow-list assumes. Filters are upstream's to change and a
      # filter that stops rewriting, or starts summarising a file read, does it
      # without a version bump anyone here would notice. Pinned version, so this
      # is deterministic; it is what catches the pin being raised carelessly.
      - name: rtk filters still match the allow-list
        run: |
          ./scripts/rtk.sh --install
          ./scripts/rtk.sh --check

      # /persona is a port carried in this repo (vendor/pi-persona/FORK.md), so
      # its regressions are ours. Two failure modes make it worth a CI step of
      # its own, and neither is visible from inside a session:
      #
      #   - The block is PREPENDED to pi's system prompt and is ~3,683 tokens of
      #     every request. An edit that changes that number changes how much of
      #     the window is left for the user's code, silently. The suite pins both
      #     modes' sizes inside a band.
      #   - The block builds its tool references from what pi says is selected
      #     THIS turn. Hardcoding a tool pi does not have is how a model ends up
      #     inventing a URL rather than fetching one, and it fails as a
      #     plausible-looking answer rather than as an error.
      #
      # Runs after `Install pi`: the extension suite redirects pi's bare
      # specifier onto the installed package so the factory runs against the same
      # import a session would.
      - name: Persona port unit tests
        working-directory: vendor/pi-persona
        run: |
          npm run lint
          npm test

      # pi-toolresult-guard is loaded FIRST in the launcher, so every other
      # tool_result handler reads a content array that is already safe. Its
      # failure mode is the session EXITING on a malformed result, which is not
      # something a green session would ever show you.
      - name: Tool-result guard unit tests
        working-directory: vendor/pi-toolresult-guard
        run: |
          npm run lint
          npm test

      # The three seats are the design, and the advisor's separate model holds
      # only because a per-agent-type entry sits ABOVE the session default in
      # this fork's model-precedence ladder. That ordering is what these two
      # files pin. The rest of this fork's suite is deliberately not run here:
      # its standing pi.exec-verdict scan is order-sensitive under the node test
      # runner's parallelism and passes alone but flakes in the full run — a
      # flaky gate is worse than no gate.
      - name: Subagent model precedence unit tests
        working-directory: vendor/pi-subagents-lite
        run: |
          node --experimental-strip-types --no-warnings --test \
            tests/mode-seed.test.ts tests/mode-agents.test.ts

      # /loop is a fork carried in this repo (vendor/pi-loop-mode/FORK.md), so
      # its regressions are ours. The suite drives the extension's real handlers
      # through the context-overflow race the fork exists to fix — a break there
      # would otherwise only show up hours into an unattended run.
      - name: Loop-mode fork unit tests
        working-directory: vendor/pi-loop-mode
        run: |
          npm run lint
          npm test

      # The browser CLI turns shell words into JSON arguments for a tool it has
      # never seen, from that tool's own schema. A regression there is silent: a
      # dropped or mistyped parameter produces a call that succeeds and does the
      # wrong thing. No server or browser is needed for these.
      - name: Browser CLI unit tests
        run: python scripts/test_browser_cli.py

      # pi-container.sh forwards an exported override into the container as
      # `-e NAME`, because docker exec starts with the container's environment,
      # not the caller's. Dropped in silence before 2026-09-24, which meant
      # `ORCHESTRATOR=1 ./scripts/pi-container.sh` came up without orchestrator
      # mode and said nothing about it.
      - name: Container env forwarding unit tests
        run: python scripts/test_container_env.py

      # Web-derived text is wrapped in an untrusted-content envelope, and the
      # envelope exists twice — Python for the CLI path, TypeScript for the
      # native-tool path. The load-bearing test is that the two copies still
      # agree, control included: a wrapper whose halves disagree teaches the
      # model that the boundary is approximate.
      - name: Untrusted-content envelope unit tests
        run: python scripts/test_untrusted_content.py

      # The Matrix channel is a conversion carried in this repo
      # (vendor/prinny-channel/FORK.md), so its regressions are ours too. Its
      # failure mode is the one worth catching in CI: a broken channel does not
      # error, it just stops delivering, and the only witness is somebody on
      # Matrix wondering why the bot ignores them.
      #
      # The sidecar's Matrix dependencies are installed and compiled outside the
      # repo, which is what --prepare does. The suite runs against that compiled
      # output rather than a re-compile of it, so this step is not optional
      # setup — it builds the artifact under test.
      - name: Matrix channel — build the sidecar runtime
        working-directory: vendor/prinny-channel
        run: node server/bin/prinny-channel.mjs --prepare

      # Five of these suites read ACROSS to a sibling vendor package's source —
      # the compaction lock, the approved-command key shared with rtk-pi, the
      # agent-dir rule, the json-store rule — plus one that reads this repo's own
      # launcher. That is what keeps duplicated protocol literals honest.
      #
      # Since the package moved to its own repo they SKIP when the neighbour is
      # absent, so its standalone CI can be green. Here the neighbours are all
      # present and a skip would mean the agreement went unchecked — which is
      # exactly how three copies of a protocol drift apart, silently. So this
      # asserts zero skips rather than just zero failures.
      - name: Matrix channel unit tests
        working-directory: vendor/prinny-channel
        run: |
          npm run lint
          npm run test:unit 2>&1 | tee /tmp/prinny.txt
          grep -q "^# fail 0" /tmp/prinny.txt
          grep -q "^# skipped 0" /tmp/prinny.txt \
            || { echo "a cross-source agreement test skipped — a sibling package is missing"; \
                 grep "^# skipped" /tmp/prinny.txt; exit 1; }

      # Separate, and after pi is installed, so "pi would not install" is not
      # reported as "the extension is broken". This is the step that catches a
      # wrong notification method name — the extension's whole job, and
      # something no unit test can see.
      - name: Matrix channel — the extension inside a real pi
        run: cd vendor/prinny-channel && npm run test:e2e

      # The prompt fragments the launcher appends to pi's system prompt. An
      # empty one, or one still carrying a placeholder the launcher does not
      # fill, fails the launch — and the launch failure is the loud half. What
      # this catches is the quiet half: a fragment that parses but says nothing.
      #
      # THINK_LANG and its Chinese-reasoning fragment are gone on this branch;
      # what remains is the orchestrator prompt, its three agent types, and the
      # two appends the launcher makes in every session.
      - name: Prompt fragments are well formed
        run: |
          for f in prompts/delegate.md prompts/web-untrusted.md \
                   prompts/orchestrator/main.md \
                   prompts/orchestrator/agents/worker.md \
                   prompts/orchestrator/agents/explorer.md \
                   prompts/orchestrator/agents/advisor.md; do
            test -s "$f" || { echo "EMPTY or MISSING: $f"; exit 1; }
            echo "  $f: OK"
          done
          # pi-local.sh refuses to launch if the orchestrator prompt has a
          # placeholder it does not fill, and it fills exactly these four.
          used="$(grep -oE '\{\{[A-Z0-9_]+\}\}' prompts/orchestrator/main.md | sort -u)"
          bad="$(printf '%s\n' "$used" \
                   | grep -vE '\{\{(MAX_AGENTS|SUBAGENT_MODEL|ADVISOR_MODEL|MAX_DEPTH)\}\}' || true)"
          test -z "$bad" \
            || { echo "prompts/orchestrator/main.md has placeholders the launcher does not fill:"; \
                 echo "$bad"; exit 1; }
          echo "  orchestrator placeholders: OK"

      # Every key a session reads through the launcher's env_get, so a rename in
      # .env that leaves the launcher falling back to a default is caught here
      # rather than as a session that ran on the wrong model. .env is committed
      # and secret-free; the Anthropic key lives in the gitignored .env.local and
      # is deliberately not in this list.
      - name: .env key validation
        run: |
          required=( ANTHROPIC_MODEL PI_CONTEXT_WINDOW PI_CONTEXT_FILES PI_CACHE_SHORT_SECONDS PI_CACHE_LONG_SECONDS PI_CACHE_WARMING PI_CACHE_RETENTION PI_SHOW_CACHE_MISS_NOTICES PI_UPDATE_MODELS_ON_LAUNCH PI_AUTO_UPDATE PI_UPDATE_INTERVAL_H SUBAGENTS_ENABLED SUBAGENT_MODEL SUBAGENT_NUDGE SUBAGENT_VERIFY SUBAGENT_MAX_CONCURRENT SUBAGENT_MAX_DEPTH ORCHESTRATOR ADVISOR_MODEL LOOP_TOOL_CHECK MCP2CLI_ENABLED MCP2CLI_VERSION MCP_SDK_VERSION BROWSER_MCP_ENABLED ZENDRIVER_MCP_DIR BROWSER_MCP_HOST BROWSER_MCP_PORT BROWSER_MCP_DISPLAY BROWSER_MCP_AUTOSTART BROWSER_MCP_TIMEOUT BROWSER_MCP_TOOL_TIMEOUT BROWSER_MCP_AUTOUP MCP_ADAPTER_ENABLED MCP_ADAPTER_VERSION RTK_ENABLED RTK_VERSION OBSERVE_ENABLED OBSERVE_PORT PRINNY_ENABLED BIND_ADDR )
          missing=0
          for key in "${required[@]}"; do
            if ! grep -qE "^${key}=" .env; then
              echo "MISSING: $key"
              missing=1
            fi
          done
          exit $missing

      # The skill is the only thing that tells the model ./scripts/mcp.sh
      # exists, and pi is lenient about malformed skills — it does not fail, it
      # just quietly does not offer them. So validate the frontmatter here
      # instead of finding out mid-session.
      - name: Agent skills are well formed
        run: |
          pip install --quiet pyyaml
          python - <<'EOF'
          import re, sys, pathlib, yaml
          bad = 0
          for p in pathlib.Path("skills").glob("*/SKILL.md"):
              err = 0
              text = p.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  print(f"{p}: no YAML frontmatter"); bad = 1; continue
              # Parsed as real YAML, not split on the first colon. A ": " inside
              # an unquoted description is a nested mapping to a YAML parser and
              # pi drops the whole skill — which is exactly how this repo shipped
              # two unloadable skills whose frontmatter a split(":") check liked.
              try:
                  fm = yaml.safe_load(m.group(1))
                  if not isinstance(fm, dict):
                      raise ValueError(f"frontmatter is {type(fm).__name__}, not a mapping")
              except Exception as e:
                  print(f"{p}: frontmatter is not valid YAML: {str(e).splitlines()[0]}")
                  bad = 1
                  continue
              fm = {k: str(v) for k, v in fm.items()}
              name, desc = fm.get("name", ""), fm.get("description", "")
              if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name) or len(name) > 64:
                  print(f"{p}: invalid name {name!r}"); err = 1
              if not desc or len(desc) > 1024:
                  print(f"{p}: description missing or over 1024 chars"); err = 1
              if len(text) - m.end() < 200:
                  print(f"{p}: body is suspiciously short"); err = 1
              bad |= err
              if not err:
                  print(f"  {p}: OK (name={name}, description={len(desc)} chars)")
          sys.exit(bad)
          EOF

      # A server entry with both transports, or neither, only fails when the
      # model reaches for it mid-task.
      - name: MCP server registry is well formed
        run: |
          python - <<'EOF'
          import json, sys
          reg = json.load(open("mcp/servers.json", encoding="utf-8"))
          bad = 0
          servers = {k: v for k, v in (reg.get("servers") or {}).items() if not k.startswith("_")}
          for name, e in servers.items():
              has = [k for k in ("stdio", "url") if e.get(k)]
              if len(has) != 1:
                  print(f"  {name}: needs exactly one of stdio/url, has {has}"); bad = 1
              else:
                  print(f"  {name}: OK ({has[0]})")
              for v in ([e["auth_header"]] if isinstance(e.get("auth_header"), str)
                        else (e.get("auth_header") or [])):
                  # A literal secret in a committed file is the failure mode worth
                  # catching automatically; env:/file: indirection is the fix.
                  if ":env:" not in v and ":file:" not in v:
                      print(f"  {name}: auth_header must use env: or file:, not a literal"); bad = 1
          sys.exit(bad)
          EOF

      # The browser must not come back as an mcp2cli server: measured at 11-60 s
      # per call against 25-417 ms through the adapter, with a per-URL tool-list
      # cache that serves a stale surface after the server changes. mcp/servers.json
      # explains this in _no_browser_entry; this keeps it true.
      - name: The browser is not registered as an mcp2cli server
        run: |
          python - <<'EOF'
          import json, sys
          reg = json.load(open("mcp/servers.json", encoding="utf-8"))
          servers = reg.get("servers") or {}
          port = None
          for line in open(".env", encoding="utf-8"):
              if line.startswith("BROWSER_MCP_PORT="):
                  port = line.split("=", 1)[1].strip()
          for name, entry in servers.items():
              target = entry.get("url") or entry.get("stdio") or ""
              if name == "browser" or (port and port in target):
                  print(f"'{name}' points the mcp2cli path at the browser: {target}")
                  sys.exit(1)
          print("  no browser entry in the mcp2cli registry: OK")
          EOF

      # mcp/adapter.json is what pi-mcp-adapter reads (--mcp-config). Two ways it
      # can rot silently: a hardcoded URL that drifts from the port browser.sh
      # binds, and an empty directTools list — which still "works", it just
      # quietly demotes the whole browse loop to proxy calls.
      - name: Browser adapter config is well formed
        run: |
          python - <<'EOF'
          import json, re, sys
          cfg = json.load(open("mcp/adapter.json", encoding="utf-8"))
          env = open(".env", encoding="utf-8").read()
          bad = 0
          server = (cfg.get("mcpServers") or {}).get("browser")
          if not server:
              print("no 'browser' server in mcp/adapter.json"); sys.exit(1)
          url = server.get("url", "")
          for var in ("BROWSER_MCP_HOST", "BROWSER_MCP_PORT"):
              if "${%s}" % var not in url:
                  # Built rather than written literally: a "${" followed by "{"
                  # anywhere in this file is an Actions expression, and the run
                  # fails before a step starts.
                  want = "$" + "{" + var + "}"
                  print(f"url must interpolate {want}, got {url!r}"); bad = 1
              if not re.search(rf"^{var}=", env, re.M):
                  print(f"{var} is not in .env"); bad = 1
          direct = server.get("directTools")
          if not isinstance(direct, list) or not direct:
              print("directTools must be a non-empty list"); bad = 1
          elif "start_browser" in direct:
              print("start_browser is 2.3KB of schema; the server auto-starts instead"); bad = 1
          guard = (cfg.get("settings") or {}).get("outputGuard") or {}
          if guard.get("maxBytes", 51200) > 16384:
              print("outputGuard.maxBytes is sized for a 200K window, not a local one"); bad = 1
          print(f"  adapter config: OK ({len(direct)} direct tools, url {url})")
          sys.exit(bad)
          EOF

      # The pin is what keeps mcp2cli working at all: SDK 2.0.0 renamed
      # Tool.inputSchema to input_schema and mcp2cli 3.3.1 still reads the old
      # name, so an unpinned install breaks every MCP call.
      - name: MCP SDK stays pinned below 2.0
        run: |
          v=$(grep -oP '(?<=^MCP_SDK_VERSION=).*' .env)
          case "$v" in
            1.*) echo "  mcp SDK pinned at $v: OK" ;;
            *)   echo "MCP_SDK_VERSION=$v — mcp2cli 3.3.1 needs mcp<2 (Tool.inputSchema)"; exit 1 ;;
          esac

      # One service (observe) survives the move off the local model, so the
      # tools profile that used to validate the llama/forge/capture one-shots is
      # gone with it.
      - name: Docker Compose config validation
        run: |
          docker compose config > /dev/null && echo "compose: OK"

      # This branch still carries no scored eval harness, and a reintroduced
      # eval.py would quietly bring back a scorecard, badges and a results/
      # directory that were deliberately deleted. The other half of the old
      # assertion — `! grep -qE '^CLAUDE_' .env` — is dropped on purpose: it
      # guarded a Claude Code launcher and its CLAUDE_* keys that this branch
      # removes entirely, and .env now carries ANTHROPIC_* keys as a matter of
      # course, so CLAUDE_* is no longer a meaningful proxy for anything.
      - name: No scored eval harness has crept back in
        run: |
          for f in scripts/eval.py scripts/eval_harness.py scripts/run-eval.sh; do
            test ! -e "$f" || { echo "REMOVED FILE IS BACK: $f"; exit 1; }
          done
          echo "  no eval harness: OK"

  # ── badge (main push only) ─────────────────────────────────────────────
  badge:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p badges
          cat > badges/ci.json << 'ENDJSON'
          {
            "schemaVersion": 1,
            "label": "ci",
            "message": "passing",
            "color": "brightgreen",
            "namedLogo": "githubactions",
            "style": "flat"
          }
          ENDJSON

      - name: Commit badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/ci.json
          if git diff --cached --quiet; then
            echo "No badge changes"
          else
            git commit -m "ci: update CI badge [skip ci]"
            git push
          fi
